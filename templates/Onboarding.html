<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Onboarding - Upward</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0d2b2e;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c8f5ee;
        }

        .container-wrap {
            width: 100%;
            max-width: 620px;
            padding: 24px;
        }

        h2 {
            font-size: 1.6rem;
            font-weight: 800;
            color: #c8f5ee;
            margin-bottom: 8px;
        }

        h2 span { color: #2ec4a0; }

        .subtitle {
            color: #4a8f8a;
            font-size: 0.92rem;
            margin-bottom: 36px;
        }

        .choice-card {
            background: #112f32;
            border: 1.5px solid #1a5c5a;
            border-radius: 16px;
            padding: 24px 28px;
            margin-bottom: 16px;
            transition: border-color 0.2s, transform 0.2s, background 0.2s;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .choice-card:hover {
            border-color: #2ec4a0;
            transform: translateX(4px);
        }

        .choice-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: #1a5c5a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
            color: #c8f5ee;
        }

        .input-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .linkedin-input {
            width: 100%;
            background: #0d2b2e;
            border: 1.5px solid #1a5c5a;
            border-radius: 12px;
            padding: 13px 14px;
            color: #c8f5ee;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
        }

        .linkedin-input::placeholder {
            color: #4a8f8a;
            font-weight: 500;
        }

        .linkedin-input:focus {
            border-color: #2ec4a0;
            box-shadow: 0 0 0 0.2rem rgba(46,196,160,0.2);
            background: #0d2b2e;
            color: #c8f5ee;
        }

        .choice-desc {
            font-size: 0.82rem;
            color: #4a8f8a;
            margin-top: 8px;
        }

        .btn-continue {
            width: 100%;
            background: #2ec4a0;
            border: none;
            color: #0d2b2e;
            font-weight: 700;
            border-radius: 12px;
            padding: 14px;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }

        .btn-continue:hover {
            background: #25a98a;
        }

        .back {
            display: inline-block;
            color: #4a8f8a;
            font-size: 0.85rem;
            text-decoration: none;
            margin-bottom: 28px;
            transition: color 0.2s;
        }

        .back:hover { color: #2ec4a0; }
    </style>
</head>
<body>
    <div class="container-wrap">
        <a href="/" class="back">← Back</a>

        <h2>Link your <span>LinkedIn</span></h2>
        <p class="subtitle">We will personalize your experience based on your profile and capabilities.</p>

        <form action="/onboarding" method="POST">
            <div class="choice-card">
               

                <div class="input-wrap">
                    <input
                        type="url"
                        name="profile"
                        class="linkedin-input"
                        placeholder="Paste your LinkedIn profile link"
                        required
                    >
                    {% if error %}
                        <p style="color:#ff6b8a;" class="text-center small">Please provide a Linked in link to your profile!</p>
                    {% endif %}
                    <div class="choice-desc">This will allow us to understand your capabilities.</div>
                    
                </div>
            </div>

            <button type="submit" class="btn-continue">Continue</button>
        </form>
    </div>
</body>
</html>
