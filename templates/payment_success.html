<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Successful - Upward</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,Segoe UI,sans-serif;background:#f7f7fa;color:#1e2240;display:flex;align-items:center;justify-content:center;min-height:100vh;}
.card{background:white;border-radius:16px;padding:48px;text-align:center;max-width:480px;width:90%;box-shadow:0 4px 20px rgba(0,0,0,.06);}
.check{width:64px;height:64px;background:#41dc65;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:2rem;color:white;font-weight:700;}
h1{font-size:1.8rem;margin-bottom:8px;}
p{color:#6b7280;margin-bottom:8px;line-height:1.6;}
.btn{display:inline-block;background:#3ec3d5;color:white;border:none;padding:12px 28px;border-radius:10px;font-weight:700;font-size:.9rem;cursor:pointer;text-decoration:none;transition:.2s;margin-top:16px;}
.btn:hover{background:#2eb3c5;}
</style>
</head>
<body>
<div class="card">
<div class="check">✓</div>
<h1>Payment Successful!</h1>
<p>Your payment was processed and you now have full access to the course.</p>
{% if not verified %}
<p style="font-size:.85rem;color:#f59e0b;">Your access will be granted momentarily. If it doesn't appear, please refresh the page.</p>
{% endif %}
<a href="/courses" class="btn">Go to Courses</a>
</div>
</body>
</html>
