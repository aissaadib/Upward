<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token }}">
<title>Upward</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #f7f7fa;
  --surface: #ffffff;
  --text: #1e2240;
  --text-secondary: #6b7280;
  --text-tertiary: #959ba6;
  --accent: #3ec3d5;
  --sidebar: #23273c;
  --success: #41dc65;
  --danger: #ff5460;
  --border: #e1e0e6;
  --radius: 6px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* NAVBAR */
.navbar{
    height:70px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 32px;
    border-bottom:1px solid var(--border);
    background:white;
    position:sticky;
    top:0;
    z-index:100;
}

.brand{
    font-size:1.8rem;
    font-weight:900;
    letter-spacing:-1px;
    text-decoration:none;
    color:inherit;
}

.brand span{color:var(--accent);}

.nav-left{display:flex;align-items:center;gap:20px;}
.nav-link{
    margin-top:3px;
    font-size:1.5rem;
    font-weight:900;
    letter-spacing:-1px;
    text-decoration:none;
    color:inherit;
}
.nav-link:hover{color:var(--accent);}
.nav-right{
    display:flex;
    align-items:center;
    gap:14px;
}

.username{
    font-size:.9rem;
    font-weight:700;
    text-decoration:none;
    color:inherit;
}

.logout{
    text-decoration:none;
    color:var(--text-secondary);
}
.logout:hover{color:var(--accent);}

/* CONTAINER */
.container {
  max-width: 1400px;
  margin: 0 0 0 28px;
  padding: 28px 28px 64px 0;
}

/* HERO */
.hero {
  margin-bottom: 28px;
}
.hero h1 {
  font-size: clamp(1.6rem, 3.5vw, 2.2rem);
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1.25;
  color: var(--text);
}
.hero p {
  margin-top: 8px;
  font-size: 1rem;
  line-height: 1.65;
  color: var(--text-secondary);
  max-width: 560px;
}

.hero-actions {
  margin-top: 16px;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  font-size: 0.9rem;
  font-weight: 500;
  font-family: inherit;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  text-decoration: none;
  background: var(--surface);
  color: var(--text-secondary);
  transition: background 0.15s, border-color 0.15s;
}
.btn:hover { border-color: var(--text-tertiary); color: var(--text); }

.btn-primary {
  background: var(--sidebar);
  color: #fff;
  border-color: var(--sidebar);
}
.btn-primary:hover { background: #1e2240; border-color: #1e2240; color: #fff; }

/* MAIN GRID */
.grid {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 0;
  align-items: start;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
}

/* PATH SELECTOR */
.path-panel-header {
  padding: 16px 14px 10px;
  margin-bottom: 4px;
  border-bottom: 1px solid var(--border);
}
.path-panel-header .section-title {
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-tertiary);
}

.path-grid {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.path {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 8px 10px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background 0.15s;
}
.path:hover { background: var(--surface); }
.path.active { background: var(--surface); }

.path-indicator {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--border);
  flex-shrink: 0;
  margin-top: 7px;
}
.path.active .path-indicator { background: var(--accent); }

.path-body { flex: 1; min-width: 0; }
.path-title {
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--text-secondary);
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.path.active .path-title { color: var(--text); font-weight: 600; }
.path-sub {
  font-size: 0.8rem;
  color: var(--text-tertiary);
  margin-top: 1px;
}

/* DETAIL PANEL */
.detail-panel {
  min-height: 300px;
  border-left: 1px solid var(--border);
  padding: 24px 28px 28px;
}
.detail-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 300px;
  color: var(--text-tertiary);
}
.detail-empty-text { font-size: 0.85rem; }

.detail-content { padding: 0; }

.detail-title {
  font-size: 1.35rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.3;
  margin-bottom: 18px;
  color: var(--text);
}

/* OUTCOME */
.outcome {
  padding: 12px 0 16px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--border);
}
.outcome-label {
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--success);
  margin-bottom: 4px;
}
.outcome-text {
  font-size: 0.95rem;
  line-height: 1.6;
  color: var(--text-secondary);
}

/* SECTION TITLE */
.section-title {
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-tertiary);
  margin-bottom: 10px;
}

/* ROADMAP */
.roadmap { margin-bottom: 28px; }
.roadmap-steps { display: flex; flex-direction: column; }
.step {
  display: flex;
  gap: 12px;
  position: relative;
}
.step + .step {
  padding-top: 0;
}
.step + .step::before {
  content: "";
  position: absolute;
  left: 7px;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--border);
}
.step-body { padding: 2px 0 16px; flex: 1; }
.step:last-child .step-body { padding-bottom: 0; }

.num {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.6rem;
  font-weight: 600;
  color: var(--text-tertiary);
  flex-shrink: 0;
  margin-top: 4px;
  position: relative;
  z-index: 1;
}
.step-text {
  font-size: 0.9rem;
  line-height: 1.55;
  color: var(--text-secondary);
}

/* RISKS */
.risks-section { margin-bottom: 28px; }
.risks-list { display: flex; flex-direction: column; gap: 4px; }
.risk {
  display: flex;
  gap: 8px;
  padding: 8px 0;
  font-size: 0.9rem;
  line-height: 1.5;
  color: var(--text-secondary);
  border-bottom: 1px solid var(--border);
}
.risk:last-child { border-bottom: none; }
.risk-icon {
  font-size: 0.75rem;
  color: var(--danger);
  flex-shrink: 0;
  margin-top: 2px;
}

/* RESOURCES */
.resources-section { margin-bottom: 24px; }
.resources-list { display: flex; flex-direction: column; gap: 4px; }
.resource {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  text-decoration: none;
  color: var(--text);
  font-size: 0.9rem;
  font-weight: 500;
  transition: border-color 0.15s;
}
.resource:hover { border-color: var(--accent); }
.resource-arrow { color: var(--text-tertiary); font-size: 0.8rem; }

/* CTA */
.cta-section {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}

.btn-lock {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: 10px 20px;
  font-size: 0.9rem;
  font-weight: 500;
  font-family: inherit;
  border: 1px solid transparent;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background 0.15s;
}

.btn-lock.btn-accent {
  background: var(--accent);
  color: #fff;
}
.btn-lock.btn-accent:hover { background: #2eb3c5; }

.btn-lock.btn-primary {
  background: var(--sidebar);
  color: #fff;
}
.btn-lock.btn-primary:hover { background: #1e2240; }

/* RESPONSIVE */
@media (max-width: 860px) {
  .navbar { padding: 0 16px; }
  .container { margin: 0 0 0 16px; padding: 16px 16px 48px 0; }
  .grid { grid-template-columns: 1fr; gap: 0; border: none; border-radius: 0; background: transparent; }
  .detail-panel { border-left: none; padding: 16px 0; }
  .path-panel-header { padding: 0 0 10px; }
  .hero { margin-bottom: 20px; }
  .hero h1 { font-size: 1.4rem; }
  .detail-content { padding: 0; }
}

@media (max-width: 480px) {
  .navbar { padding: 0 12px; }
  .brand { font-size: 0.95rem; }
  .nav-link { display: none; }
  .hero h1 { font-size: 1.1rem; }
  .hero p { font-size: 0.82rem; }
  .step-body { padding-bottom: 12px; }
  .risk { padding: 6px 0; font-size: 0.82rem; }
  .resource { padding: 7px 8px; }
  .path { padding: 6px 8px; }
}
</style>
</head>

<body>

<nav class="navbar">
  <div class="nav-left">
    <a href="/" class="brand">Up<span>ward</span></a>
    <a href="/courses" class="nav-link">Courses</a>
  </div>
  <div class="nav-right">
    <span class="username">{{ username }}</span>
    <a class="logout" href="/logout">Logout</a>
  </div>
</nav>

<div class="container">

  <div class="hero">
    <h1>Career system based on real outcomes.</h1>
    <p>Not advice. Not opinions. A structured breakdown of paths, risks, timelines, and expected results based on your profile.</p>
    <div class="hero-actions">
      <button class="btn btn-primary" onclick="generate()">Generate suggestions</button>
    </div>
  </div>

  <div class="grid">

    <!-- LEFT: PATHS -->
    <div>
      <div class="path-panel-header">
        <div class="section-title">Possible Paths</div>
      </div>
      <div class="path-grid" id="paths"></div>
    </div>

    <!-- RIGHT: DETAILS -->
    <div class="detail-panel">
      <div class="detail-empty" id="details">
        <div class="detail-empty-text">Select a path to view structured analysis.</div>
      </div>
    </div>

  </div>

</div>

<script>
(function(){var t=document.querySelector('meta[name="csrf-token"]');if(!t)return;var c=t.getAttribute('content');if(!c)return;var o=window.fetch;window.fetch=function(u,i){i=i||{};if(!i.method||i.method.toUpperCase()==='GET')return o(u,i);i.headers=i.headers||{};i.headers['X-CSRF-Token']=c;return o(u,i);};})();

var planAccess = {{ plan_access | tojson }};

let data = [];
let active = 0;

function esc(s){
    return String(s||"").replaceAll("<","&lt;").replaceAll(">","&gt;");
}

function renderPaths(){
    const box = document.getElementById("paths");
    box.innerHTML = "";

    data.forEach((p,i)=>{
        const div = document.createElement("div");
        div.className = "path" + (i===active?" active":"");
        div.onclick = ()=>{active=i; render();};

        div.innerHTML = `
            <div class="path-indicator"></div>
            <div class="path-body">
                <div class="path-title">${esc(p.title)}</div>
                <div class="path-sub">${esc(p.category || "Career path")}</div>
            </div>
        `;

        box.appendChild(div);
    });
}

function render(){
    renderPaths();

    const d = data[active];
    const container = document.getElementById("details");

    if(!d){
        container.innerHTML = `<div class="detail-empty"><div class="detail-empty-text">No data</div></div>`;
        return;
    }

    const steps = d.roadmap?.length ? d.roadmap : [
        "Learn fundamentals",
        "Build project",
        "Gain experience",
        "Apply to roles"
    ];

    const risks = d.risks?.length ? d.risks : [
        "Requires consistency over time",
        "Competitive field",
        "Needs portfolio work"
    ];

    container.innerHTML = `
        <div class="detail-content">
            <h2 class="detail-title">${esc(d.title)}</h2>

            <div class="outcome">
                <div class="outcome-label">Expected Outcome</div>
                <div class="outcome-text">${esc(d.outcome)}</div>
            </div>

            <div class="roadmap">
                <div class="section-title">Roadmap</div>
                <div class="roadmap-steps">
                    ${steps.map((s,i)=>`
                        <div class="step">
                            <div class="num">${i+1}</div>
                            <div class="step-body">
                                <div class="step-text">${esc(s)}</div>
                            </div>
                        </div>
                    `).join("")}
                </div>
            </div>

            <div class="risks-section">
                <div class="section-title">Risks / Reality Check</div>
                <div class="risks-list">
                    ${risks.map(r=>`
                        <div class="risk">
                            <span class="risk-icon">!</span>
                            <span>${esc(r)}</span>
                        </div>
                    `).join("")}
                </div>
            </div>

            <div class="resources-section">
                <div class="section-title">Resources</div>
                <div class="resources-list">
                    ${[
                        {label:"Google this path", url:`https://www.google.com/search?q=${encodeURIComponent(d.title + " " + (d.category||"career"))}`},
                        {label:"YouTube tutorials", url:`https://www.youtube.com/results?search_query=${encodeURIComponent(d.title + " career guide")}`},
                        {label:"LinkedIn jobs", url:`https://www.linkedin.com/jobs/search/?keywords=${encodeURIComponent(d.title)}`}
                    ].map(r=>`
                        <a class="resource" href="${r.url}" target="_blank">
                            <span>${esc(r.label)}</span>
                            <span class="resource-arrow">→</span>
                        </a>
                    `).join("")}
                </div>
            </div>

            <div class="cta-section">
                ${planAccess ? `
                <button type="button" class="btn-lock btn-primary" onclick="choosePlan(${active})">
                    Choose as my main plan
                </button>` : `
                <button type="button" class="btn-lock btn-accent" onclick="buyPlan(${active})">
                    Buy Extended Plan — 130 MAD
                </button>`}
            </div>
        </div>
    `;
}

async function choosePlan(index){
    const suggestion = data[index];
    if(!suggestion) return;

    try {
        const res = await fetch("/plan/select", {
            method: "POST",
            credentials: "include", 
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(suggestion)
        });

        const json = await res.json();

        if(!res.ok || !json.redirect){
            throw new Error(json.error || "Redirect missing");
        }

        window.location.href = json.redirect;

    } catch (err) {
        console.error(err);
        alert("Something went wrong selecting your plan.");
    }
}

async function buyPlan(index){
    const suggestion = data[index];
    if(!suggestion) return;
    try {
        await fetch("/plan/select", {
            method:"POST", credentials:"include",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify(suggestion)
        });
        const res = await fetch("/create-plan-checkout", {
            method:"POST", credentials:"include",
            headers:{"Content-Type":"application/json"}
        });
        const json = await res.json();
        if(!res.ok) throw new Error(json.error || "Payment setup failed");
        window.location.href = json.url;
    } catch (err) {
        console.error(err);
        alert(err.message);
    }
}

async function generate(){
    const res = await fetch("/generate_advice", {
        method: "POST",
        credentials: "include",   
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({count:5})
    });

    const json = await res.json();

    if(json.error){
        document.getElementById("paths").innerHTML = 
            `<p style="color:#ff5460;font-size:.9rem;">${json.error}</p>`;
        return;
    }

    data = json.advice || [];
    active = 0;
    render();
}

generate();

</script>
</body>
</html>
