<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upward</title>

<style>
:root{
    --sidebar:#23273c;
    --sidebar-deep:#1e2240;
    --accent:#3ec3d5;
    --success:#41dc65;
    --danger:#ff5460;
    --bg:#f7f7fa;
    --text:#1e2240;
    --text-secondary:#6b7280;
    --border:#e1e0e6;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:Inter,Segoe UI,sans-serif;
    background:var(--bg);
    color:var(--text);
}

/* NAV */
.navbar{
    height:70px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 32px;
    border-bottom:1px solid var(--border);
    background:white;
    position:sticky;
    top:0;
}

.brand{
    font-size:1.8rem;
    font-weight:900;
    text-decoration:none;
    color:inherit;
}

.brand span{color:var(--accent);}

.username{font-weight:700;}
.logout{color:var(--text-secondary);text-decoration:none;}
.logout:hover{color:var(--accent);}

.container{
    width:min(1100px,90%);
    margin:auto;
}

/* HERO */
.hero{
    padding:90px 0 40px;
}

.hero h1{
    font-size:3rem;
    line-height:1.1;
}

.hero p{
    margin-top:16px;
    color:var(--text-secondary);
    max-width:700px;
}

.btn{
    display:inline-block;
    margin-top:20px;
    padding:14px 22px;
    background:var(--sidebar);
    color:white;
    border-radius:12px;
    text-decoration:none;
    font-weight:700;
}

/* SYSTEM GRID */
.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-top:40px;
}

.card{
    background:white;
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
}

/* PATH SELECTOR */
.path-grid{
    display:grid;
    gap:10px;
}

.path{
    padding:14px;
    border-radius:12px;
    border:1px solid var(--border);
    cursor:pointer;
    background:white;
    transition:.2s;
}

.path:hover{
    border-color:var(--accent);
}

.path.active{
    border-left:4px solid var(--accent);
    background:#f0fcff;
}

.path-title{
    font-weight:800;
}

.path-sub{
    font-size:.85rem;
    color:var(--text-secondary);
}

/* OUTCOME */
.outcome{
    padding:12px;
    border-left:4px solid var(--success);
    background:#e9fff0;
    margin:12px 0;
}

/* SECTION TITLE */
.section-title{
    font-size:.75rem;
    font-weight:800;
    color:var(--accent);
    letter-spacing:.1em;
    text-transform:uppercase;
    margin:12px 0;
}

/* STEPS */
.step{
    display:flex;
    gap:10px;
    padding:10px;
    border-bottom:1px solid var(--border);
}

.num{
    width:26px;
    height:26px;
    display:grid;
    place-items:center;
    background:var(--accent);
    color:white;
    border-radius:6px;
    font-weight:900;
}

/* RISKS */
.risk{
    background:#fff3f3;
    border-left:4px solid var(--danger);
    padding:10px;
    margin-top:10px;
    font-size:.9rem;
}

/* RESOURCES */
.resource{
    display:block;
    padding:10px;
    margin:8px 0;
    border:1px solid var(--border);
    border-radius:10px;
    text-decoration:none;
    color:var(--text);
}

.resource:hover{
    border-color:var(--accent);
}
</style>
</head>

<body>

<div class="navbar">
    <a href="/" class="brand">Up<span>ward</span></a>
    <div>
        <span class="username">{{ username }}</span>
        <a class="logout" href="/logout">Logout</a>
    </div>
</div>

<div class="container">

    <!-- HERO -->
    <div class="hero">
        <h1>Career system based on real outcomes.</h1>
        <p>
            Not advice. Not opinions. A structured breakdown of paths,
            risks, timelines, and expected results based on your profile.
        </p>
        <a class="btn" onclick="generate()">Generate System</a>
    </div>

    <div class="grid">

        <!-- LEFT: PATHS -->
        <div class="card">
            <div class="section-title">Possible Paths</div>
            <div class="path-grid" id="paths"></div>
        </div>

        <!-- RIGHT: DETAILS -->
        <div class="card" id="details">
            Select a path to view structured analysis.
        </div>

    </div>

</div>

<script>

let data = [];
let active = 0;

function esc(s){
    return String(s||"").replaceAll("<","&lt;").replaceAll(">","&gt;");
}

function renderPaths(){
    const box = document.getElementById("paths");
    box.innerHTML = "";

    data.forEach((p,i)=>{
        const div = document.createElement("div");
        div.className = "path" + (i===active?" active":"");
        div.onclick = ()=>{active=i; render();};

        div.innerHTML = `
            <div class="path-title">${esc(p.title)}</div>
            <div class="path-sub">${esc(p.category || "Career path")}</div>
        `;

        box.appendChild(div);
    });
}

function render(){
    renderPaths();

    const d = data[active];
    const box = document.getElementById("details");

    if(!d){
        box.innerHTML = "No data";
        return;
    }

    const steps = d.roadmap?.length ? d.roadmap : [
        "Learn fundamentals",
        "Build project",
        "Gain experience",
        "Apply to roles"
    ];

    const risks = d.risks?.length ? d.risks : [
        "Requires consistency over time",
        "Competitive field",
        "Needs portfolio work"
    ];

    const resources = d.links || [];

    box.innerHTML = `
        <h2>${esc(d.title)}</h2>

        <div class="outcome">
            <strong>Expected Outcome:</strong><br>
            ${esc(d.outcome)}
        </div>

        <div class="section-title">Roadmap (Action Plan)</div>
        ${steps.map((s,i)=>`
            <div class="step">
                <div class="num">${i+1}</div>
                <div>${esc(s)}</div>
            </div>
        `).join("")}

        <div class="section-title">Risks / Reality Check</div>
        ${risks.map(r=>`<div class="risk">${esc(r)}</div>`).join("")}

        <div class="section-title">Resources</div>
        ${resources.map(r=>`
            <a class="resource" href="${r.url}" target="_blank">
                ${esc(r.label)}
            </a>
        `).join("")}
    `;
}

async function generate(){
    const res = await fetch("/generate_advice",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({count:5})
    });

    const json = await res.json();
    data = json.advice || [];

    active = 0;
    render();
}

generate();

</script>

</body>
</html>
