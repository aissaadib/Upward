<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build Your Plan - Upward</title>
<style>
:root{
    --sidebar:#23273c;
    --accent:#3ec3d5;
    --success:#41dc65;
    --danger:#ff5460;
    --bg:#f7f7fa;
    --text:#1e2240;
    --text-secondary:#6b7280;
    --border:#e1e0e6;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,Segoe UI,sans-serif;background:var(--bg);color:var(--text);}
.navbar{height:70px;display:flex;justify-content:space-between;align-items:center;padding:0 32px;border-bottom:1px solid var(--border);background:white;position:sticky;top:0;}
.brand{font-size:1.8rem;font-weight:900;text-decoration:none;color:inherit;}
.brand span{color:var(--accent);}
.logout{color:var(--text-secondary);text-decoration:none;margin-left:14px;}
.container{width:min(900px,90%);margin:auto;padding:48px 0 80px;}
.hero h1{font-size:2.2rem;line-height:1.15;margin-bottom:10px;}
.hero p{color:var(--text-secondary);max-width:640px;line-height:1.7;}
.badge{display:inline-block;margin-top:14px;padding:6px 12px;border-radius:999px;background:#eef8fa;color:var(--accent);font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;}
.loading{padding:60px 0;text-align:center;color:var(--text-secondary);}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;margin:0 auto 16px;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.card{background:white;border:1px solid var(--border);border-radius:16px;padding:24px;margin-top:24px;}
.section-title{font-size:.75rem;font-weight:800;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;margin:24px 0 12px;}
.section-title:first-child{margin-top:0;}
.highlight{padding:16px;border-left:4px solid var(--success);background:#e9fff0;border-radius:0 12px 12px 0;margin-bottom:8px;line-height:1.6;}
.phase{border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px;}
.phase-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px;}
.phase-month{background:var(--accent);color:white;font-weight:800;font-size:.75rem;padding:4px 10px;border-radius:999px;white-space:nowrap;}
.phase h3{font-size:1.05rem;}
ul{padding-left:18px;line-height:1.8;color:var(--text-secondary);}
ul li{margin-bottom:4px;}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.pill{padding:6px 10px;border-radius:999px;background:#f0fcff;border:1px solid #d6f3f8;font-size:.82rem;}
.risk{background:#fff3f3;border-left:4px solid var(--danger);padding:12px;border-radius:0 10px 10px 0;margin-bottom:8px;font-size:.92rem;}
.resource{display:block;padding:12px;margin:8px 0;border:1px solid var(--border);border-radius:10px;text-decoration:none;color:var(--text);}
.resource:hover{border-color:var(--accent);}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px;}
.btn{display:inline-block;padding:14px 22px;border-radius:12px;font-weight:700;text-decoration:none;border:none;cursor:pointer;font-size:.95rem;}
.btn-primary{background:var(--sidebar);color:white;}
.btn-primary:hover{background:#1e2240;}
.btn-ghost{background:white;border:1.5px solid var(--border);color:var(--text);}
.error{color:var(--danger);padding:20px 0;}
</style>
</head>
<body>
<div class="navbar">
    <a href="/" class="brand">Up<span>ward</span></a>
    <div>
        <span>{{ username }}</span>
        <a class="logout" href="/logout">Logout</a>
    </div>
</div>

<div class="container">
    <div class="hero">
        <div class="badge">{{ suggestion.category or "Career path" }}</div>
        <h1 id="plan-title">{{ suggestion.title }}</h1>
        <p>Building your full roadmap — month-by-month actions, skills, resources, and checkpoints tailored to your profile.</p>
    </div>

    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Generating your extended plan…</p>
    </div>

    <div id="content" style="display:none;"></div>
    <div id="error" class="error" style="display:none;"></div>
</div>

<script>
function esc(s){
    return String(s||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
}

function renderPlan(p){
    const phases = p.phases || [];
    const skills = p.skills_to_build || [];
    const habits = p.weekly_habits || [];
    const metrics = p.success_metrics || [];
    const pitfalls = p.pitfalls || [];
    const risks = p.risks || [];
    const links = p.links || [];

    document.getElementById("plan-title").textContent = p.title || document.getElementById("plan-title").textContent;

    document.getElementById("content").innerHTML = `
        <div class="card">
            <div class="section-title">Overview</div>
            <p>${esc(p.summary)}</p>
            ${p.next_action ? `<div class="highlight" style="margin-top:16px;"><strong>Do this first (next 48h):</strong><br>${esc(p.next_action)}</div>` : ""}
        </div>

        ${habits.length ? `
        <div class="card">
            <div class="section-title">Weekly habits</div>
            <ul>${habits.map(h=>`<li>${esc(h)}</li>`).join("")}</ul>
        </div>` : ""}

        <div class="card">
            <div class="section-title">${p.timeline_months || phases.length || 6}-month roadmap</div>
            ${phases.map(ph => `
                <div class="phase">
                    <div class="phase-head">
                        <h3>${esc(ph.title)}</h3>
                        <span class="phase-month">Month ${esc(ph.month)}</span>
                    </div>
                    ${ph.focus ? `<p style="color:var(--text-secondary);margin-bottom:10px;">${esc(ph.focus)}</p>` : ""}
                    ${ph.actions?.length ? `<strong>Actions</strong><ul>${ph.actions.map(a=>`<li>${esc(a)}</li>`).join("")}</ul>` : ""}
                    ${ph.skills?.length ? `<div class="pill-row">${ph.skills.map(s=>`<span class="pill">${esc(s)}</span>`).join("")}</div>` : ""}
                    ${ph.deliverable ? `<div class="highlight" style="margin-top:12px;"><strong>Deliverable:</strong> ${esc(ph.deliverable)}</div>` : ""}
                    ${ph.resources?.length ? ph.resources.map(r=>`<a class="resource" href="${esc(r.url)}" target="_blank">${esc(r.label)}${r.why ? ` — ${esc(r.why)}` : ""}</a>`).join("") : ""}
                </div>
            `).join("")}
        </div>

        ${skills.length ? `
        <div class="card">
            <div class="section-title">Skills to build</div>
            ${skills.map(s => `
                <div style="margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border);">
                    <strong>${esc(s.skill)}</strong>
                    ${s.priority ? ` <span class="pill">${esc(s.priority)} priority</span>` : ""}
                    ${s.how ? `<p style="color:var(--text-secondary);margin-top:6px;">${esc(s.how)}</p>` : ""}
                </div>
            `).join("")}
        </div>` : ""}

        ${metrics.length ? `
        <div class="card">
            <div class="section-title">Success metrics</div>
            <ul>${metrics.map(m=>`<li>${esc(m)}</li>`).join("")}</ul>
        </div>` : ""}

        ${pitfalls.length ? `
        <div class="card">
            <div class="section-title">Avoid these pitfalls</div>
            ${pitfalls.map(x=>`<div class="risk">${esc(x)}</div>`).join("")}
        </div>` : ""}

        ${risks.length ? `
        <div class="card">
            <div class="section-title">Risks & reality check</div>
            ${risks.map(r=>`<div class="risk">${esc(r)}</div>`).join("")}
        </div>` : ""}

        ${links.length ? `
        <div class="card">
            <div class="section-title">Key resources</div>
            ${links.map(r=>`<a class="resource" href="${esc(r.url)}" target="_blank">${esc(r.label)}${r.when ? ` <span style="color:var(--text-secondary);">(${esc(r.when)})</span>` : ""}</a>`).join("")}
        </div>` : ""}

        <div class="actions">
            <form action="/plan/lock" method="POST" style="display:inline;">
                <button type="submit" class="btn btn-primary">Pin as my main plan</button>
            </form>
            <a href="/advice" class="btn btn-ghost">Pick a different path</a>
        </div>
    `;
}

async function load(){
    try{
        const res = await fetch("/generate_extended_plan",{method:"POST",headers:{"Content-Type":"application/json"}});
        const json = await res.json();
        if(!res.ok) throw new Error(json.error || "Failed to generate plan");
        document.getElementById("loading").style.display = "none";
        document.getElementById("content").style.display = "block";
        renderPlan(json.plan);
    }catch(e){
        document.getElementById("loading").style.display = "none";
        document.getElementById("error").style.display = "block";
        document.getElementById("error").textContent = e.message;
    }
}

load();
</script>
</body>
</html>
