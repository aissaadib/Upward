<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token }}">
<title>Build Your Plan - Upward</title>
<style>
:root{
    --sidebar:#23273c;
    --sidebar-deep:#1e2240;
    --accent:#3ec3d5;
    --success:#41dc65;
    --danger:#ff5460;
    --bg:#f7f7fa;
    --text:#1e2240;
    --text-secondary:#6b7280;
    --border:#e1e0e6;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Inter,Segoe UI,sans-serif;
    background:var(--bg);
    color:var(--text);
}

.navbar{
    height:72px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 32px;
    background:white;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:100;
}

.brand{
    font-size:1.9rem;
    font-weight:900;
    text-decoration:none;
    color:var(--text);
    letter-spacing:-1px;
}

.brand span{
    color:var(--accent);
}

.logout{
    color:var(--text-secondary);
    text-decoration:none;
    margin-left:14px;
}

.logout:hover{
    color:var(--accent);
}

.container{
    width:min(1300px,95%);
    margin:auto;
    padding:50px 0 100px;
}

.hero{
    margin-bottom:80px;
}

.badge{
    display:inline-flex;
    align-items:center;
    padding:8px 14px;
    border-radius:999px;
    background:#eefcff;
    color:var(--accent);
    font-size:.75rem;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.08em;
    margin-bottom:16px;
}

.hero h1{
    font-size:clamp(3rem,6vw,5rem);
    line-height:.95;
    letter-spacing:-4px;
    margin-bottom:18px;
    max-width:950px;
}

.hero p{
    color:var(--text-secondary);
    max-width:700px;
    line-height:1.8;
    font-size:1.1rem;
}

.loading{
    padding:90px 0;
    text-align:center;
    color:var(--text-secondary);
}

.spinner{
    width:50px;
    height:50px;
    border:4px solid #e8ecf0;
    border-top:4px solid var(--accent);
    border-radius:50%;
    margin:0 auto 20px;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}
.card{
    margin-top:60px;
    padding-top:20px;
    border-top:1px solid var(--border);
}


.section-title{
    font-size:.78rem;
    font-weight:900;
    color:var(--accent);
    text-transform:uppercase;
    letter-spacing:.12em;
    margin-bottom:18px;
}

.highlight{
    background:#eefcff;
    border:none;
    border-radius:18px;
    padding:24px;
    line-height:1.8;
}
.phase{
    position:relative;

    padding:0 0 50px 60px;

    margin-bottom:0;

    border:none;

    background:none;
}

.phase::before{
    content:"";

    position:absolute;

    left:18px;

    top:24px;

    bottom:-10px;

    width:2px;

    background:#dfe7eb;
}
.phase::after{
    content:"";

    position:absolute;

    left:8px;
    top:10px;

    width:22px;
    height:22px;

    border-radius:50%;

    background:var(--accent);

    border:5px solid white;

    box-shadow:0 0 0 1px var(--accent);
}

.phase:last-child::before{
    display:none;
}

.phase-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    margin-bottom:12px;
}

.phase-month{
    background:var(--sidebar);

    color:white;

    padding:6px 12px;

    border-radius:999px;

    font-size:.75rem;

    font-weight:800;
}

.phase h3{
    font-size:1.1rem;
}

ul{
    list-style:none;
    padding-left:0;
    color:var(--text-secondary);
}

ul li{
    position:relative;

    padding-left:24px;

    margin-bottom:10px;
}
ul li::before{
    content:"";

    position:absolute;

    left:0;
    top:11px;

    width:8px;
    height:8px;

    border-radius:50%;

    background:var(--accent);
}
.pill-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:14px;
}

.pill{
    background:white;

    border:1px solid var(--border);

    padding:12px 16px;

    border-radius:999px;

    font-size:.85rem;

    font-weight:700;
}
.resource{
    color:rgb(105, 203, 255);

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:18px 0;

    margin:0;

    border:none;

    border-bottom:1px solid var(--border);

    background:none;

    color:var(--text);

    text-decoration:none;
}
.resource::after{
    content:"→";
    color:var(--accent);
    font-weight:900;
}
.resource:hover{
    transform:none;
}
.risk{
    background:#fff8f8;

    border-left:4px solid var(--danger);

    border-radius:0 14px 14px 0;

    padding:18px;

    margin-bottom:14px;

    line-height:1.7;
}

.actions{
    position:fixed;

    left:50%;

    transform:translateX(-50%);

    bottom:24px;

    width:min(900px,92%);

    display:flex;

    gap:12px;

    background:white;

    border:1px solid var(--border);

    border-radius:18px;

    padding:16px;

    z-index:999;

    box-shadow:
    0 15px 40px rgba(0,0,0,.08);
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:14px 22px;
    border-radius:12px;
    font-weight:700;
    text-decoration:none;
    cursor:pointer;
}

.btn-primary{
    background:var(--sidebar);
    color:white;
    border:none;
}

.btn-primary:hover{
    background:var(--sidebar-deep);
}

.btn-ghost{
    background:white;
    border:1px solid var(--border);
    color:var(--text);
}

.btn-ghost:hover{
    border-color:var(--accent);
}

.error{
    color:var(--danger);
    padding:24px;
    background:#fff5f5;
    border:1px solid #ffd9d9;
    border-radius:14px;
}

@media(max-width:900px){
    .container{width:92%;padding:30px 0 80px;}
    .navbar{padding:0 14px;height:60px;}
    .navbar div{display:flex;align-items:center;gap:8px;}
    .navbar span{font-size:.85rem;}
    .hero{margin-bottom:40px;}
    .hero h1{font-size:clamp(1.8rem,7vw,2.8rem);letter-spacing:-1px;}
    .hero p{font-size:.95rem;}
    .phase-head{flex-direction:column;gap:8px;}
    .phase{border-left:3px solid var(--accent);padding-left:20px;padding-bottom:30px;margin-bottom:0;}
    .phase::before,.phase::after{display:none;}
    .highlight{padding:16px;border-radius:12px;font-size:.9rem;}
    .actions{position:static;transform:none;width:100%;flex-direction:column;gap:8px;padding:12px;margin-top:30px;}
    .btn{width:100%;padding:12px 16px;font-size:.9rem;}
    .card{margin-top:30px;padding-top:16px;}
    ul li{padding-left:18px;font-size:.9rem;}
    .pill{font-size:.8rem;padding:8px 12px;}
}

@media(max-width:480px){
    .container{width:94%;padding:20px 0 60px;}
    .navbar{padding:0 10px;height:52px;}
    .brand{font-size:1.4rem;}
    .hero h1{font-size:clamp(1.4rem,6vw,1.8rem);}
    .hero p{font-size:.85rem;line-height:1.6;}
    .badge{font-size:.65rem;padding:6px 10px;}
    .section-title{font-size:.7rem;}
    .phase{padding-left:14px;padding-bottom:24px;}
    .phase h3{font-size:.95rem;}
    .phase-month{font-size:.65rem;padding:4px 10px;}
    .card{margin-top:20px;padding-top:12px;}
    .actions{padding:10px;gap:6px;}
}
</style>
</head>
<body>
<div class="navbar">
    <a href="/" class="brand">Up<span>ward</span></a>
    <div>
        <span>{{ username }}</span>
        <a class="logout" href="/logout">Logout</a>
    </div>
</div>

<div class="container">
    <div class="hero">
        <div class="badge">{{ suggestion.category or "Career path" }}</div>
        <h1 id="plan-title">{{ suggestion.title }}</h1>
        <p>Building your full roadmap — month-by-month actions, skills, resources, and checkpoints tailored to your profile.</p>
    </div>

    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>creating the perfect for plan you…</p>
    </div>

    <div id="content" style="display:none;"></div>
    <div id="error" class="error" style="display:none;"></div>
</div>

{% if plan_data %}
<script>
    window.planData = {{ plan_data | tojson }};
</script>
{% endif %}

<script>
// Escape HTML entities and handle objects gracefully
function esc(s){
    return String(s==null?"":(typeof s==="object"?JSON.stringify(s):s)).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
}
function toStr(a){return typeof a==="string"?a:typeof a==="object"?JSON.stringify(a):String(a||"");}
function toArr(a){return Array.isArray(a)?a:typeof a==="string"?[a]:[];}

function renderPlan(p){
    const phases = toArr(p.phases);
    const skills = toArr(p.skills_to_build);
    const courses = toArr(p.courses);
    const habits = toArr(p.weekly_habits);
    const metrics = toArr(p.success_metrics);
    const risks = toArr(p.risks);
    const links = toArr(p.links);

    document.getElementById("plan-title").textContent = p.title || document.getElementById("plan-title").textContent;

    document.getElementById("content").innerHTML = `
        <div class="card">
            <div class="section-title">Overview</div>
            <p>${esc(p.summary)}</p>
            ${p.next_action ? `<div class="highlight" style="margin-top:16px;"><strong>Do this first (next 48h):</strong><br>${esc(p.next_action)}</div>` : ""}
        </div>

        ${habits.length ? `
        <div class="card">
            <div class="section-title">Weekly habits</div>
            <ul>${habits.map(h=>`<li>${esc(toStr(h))}</li>`).join("")}</ul>
        </div>` : ""}

        <div class="card">
            <div class="section-title">${p.timeline_months || phases.length || 6}-month roadmap</div>
            ${phases.map(ph => `
                <div class="phase">
                    <div class="phase-head">
                        <h3>${esc(ph.title)}</h3>
                        <span class="phase-month">Month ${esc(ph.month)}</span>
                    </div>
                    ${ph.focus ? `<p style="color:var(--text-secondary);margin-bottom:10px;">${esc(ph.focus)}</p>` : ""}
                    ${ph.weekly_focus?.length ? `<div style="margin:10px 0 12px;padding:12px;background:#f8f9fb;border-radius:8px;font-size:.9rem;"><strong style="display:block;margin-bottom:6px;">Weekly breakdown:</strong>${ph.weekly_focus.map((w,i)=>`<div style="margin-bottom:4px;">• <strong>Week ${i+1}:</strong> ${esc(toStr(w))}</div>`).join("")}</div>` : ""}
                    ${ph.actions?.length ? `<strong>Actions</strong><ul>${ph.actions.map(a=>`<li>${esc(toStr(a))}</li>`).join("")}</ul>` : ""}
                    ${ph.tools?.length ? `<div style="margin-top:8px;"><strong>Tools:</strong> ${ph.tools.map(t=>`<span class="pill">${esc(t)}</span>`).join(" ")}</div>` : ""}
                    ${ph.skills?.length ? `<div class="pill-row">${ph.skills.map(s=>`<span class="pill">${esc(s)}</span>`).join("")}</div>` : ""}
                    ${ph.reading?.length ? `<div style="margin-top:10px;font-size:.9rem;"><strong>Reading:</strong><ul>${ph.reading.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>` : ""}
                    ${ph.deliverable ? `<div class="highlight" style="margin-top:12px;"><strong>Deliverable:</strong> ${esc(ph.deliverable)}</div>` : ""}
                    ${ph.resources?.length ? ph.resources.map(r=>`<a class="resource" href="${esc(r.url)}" target="_blank">${esc(r.label)}${r.why ? ` — ${esc(r.why)}` : ""}</a>`).join("") : ""}
                </div>
            `).join("")}
        </div>

        ${skills.length ? `
        <div class="card">
            <div class="section-title">Skills to build</div>
            ${skills.map(s => `
                <div style="margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border);">
                    <strong>${esc(s.skill)}</strong>
                    ${s.priority ? ` <span class="pill">${esc(s.priority)} priority</span>` : ""}
                    ${s.how ? `<p style="color:var(--text-secondary);margin-top:6px;">${esc(s.how)}</p>` : ""}
                </div>
            `).join("")}
        </div>` : ""}

        ${courses.length ? `
        <div class="card">
            <div class="section-title">Courses & Programs</div>
            ${courses.map(c => `
                <div style="margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border);">
                    <strong>${esc(c.name)}</strong>
                    ${c.provider ? ` <span class="pill">${esc(c.provider)}</span>` : ""}
                    ${c.description ? `<p style="color:var(--text-secondary);margin-top:6px;">${esc(c.description)}</p>` : ""}
                    ${c.why ? `<p style="color:var(--text-secondary);font-size:.9rem;margin-top:4px;"><em>Why: ${esc(c.why)}</em></p>` : ""}
                    <a class="resource" href="https://www.google.com/search?q=${encodeURIComponent(c.name + " " + (c.provider||"course"))}" target="_blank" style="margin-top:8px;display:inline-flex;border:1px solid var(--border);border-radius:8px;padding:8px 14px;text-decoration:none;color:var(--text);font-weight:600;">
                        Find this course →
                    </a>
                </div>
            `).join("")}
        </div>` : ""}

        ${metrics.length ? `
        <div class="card">
            <div class="section-title">Success metrics</div>
            <ul>${metrics.map(m=>`<li>${esc(toStr(m))}</li>`).join("")}</ul>
        </div>` : ""}
        ${risks.length ? `
        <div class="card">
            <div class="section-title">Risks & reality check</div>
            ${risks.map(r=>`<div class="risk">${esc(toStr(r))}</div>`).join("")}
        </div>` : ""}

        ${links.length ? `
        <div class="card">
            <div class="section-title">Additional Resources</div>
            ${links.map(r=>`
                <div style="margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border);">
                    <strong>${esc(r.name||r.label)}</strong>
                    ${r.platform ? ` <span class="pill">${esc(r.platform)}</span>` : ""}
                    ${(r.description||r.label) ? `<p style="color:var(--text-secondary);margin-top:6px;">${esc(r.description||r.label)}</p>` : ""}
                    ${r.when ? `<p style="color:var(--text-secondary);font-size:.9rem;margin-top:4px;"><em>When: ${esc(r.when)}</em></p>` : ""}
                    <a class="resource" href="https://www.google.com/search?q=${encodeURIComponent((r.name||r.label) + " " + (r.platform||""))}" target="_blank" style="margin-top:8px;display:inline-flex;border:1px solid var(--border);border-radius:8px;padding:8px 14px;text-decoration:none;color:var(--text);font-weight:600;">
                        Find this resource →
                    </a>
                </div>
            `).join("")}
        </div>` : ""}
        {% if locked == 0 %}
            <div class="actions">    
                <form action="/plan/lock" method="POST" style="display:inline;">
                    {{ csrf_input|safe }}
                    <button type="submit" class="btn btn-primary">Pin as my main plan</button>
                </form>       
            </div>
        {% endif %}
    `;
}

// Load plan data — either pre-rendered from server or fetch a new one
async function load(){
    if(window.planData){
        // Plan data was embedded in the page by the server
        document.getElementById("loading").style.display = "none";
        document.getElementById("content").style.display = "block";
        renderPlan(window.planData);
    }else{
        // Generate a new extended plan via the API
        try{
            const res = await fetch("/generate_extended_plan",{method:"POST",headers:{"Content-Type":"application/json"}});
            const json = await res.json();
            if(!res.ok) throw new Error(json.error || "Failed to generate plan");
            document.getElementById("loading").style.display = "none";
            document.getElementById("content").style.display = "block";
            renderPlan(json.plan);
        }catch(e){
            document.getElementById("loading").style.display = "none";
            document.getElementById("error").style.display = "block";
            document.getElementById("error").textContent = e.message;
        }
    }
}

// Load the plan on page load
load();
</script>
<script>
(function(){var t=document.querySelector('meta[name="csrf-token"]');if(!t)return;var c=t.getAttribute('content');if(!c)return;var o=window.fetch;window.fetch=function(u,i){i=i||{};if(!i.method||i.method.toUpperCase()==='GET')return o(u,i);i.headers=i.headers||{};i.headers['X-CSRF-Token']=c;return o(u,i);};})();
</script>
</body>
</html>
