<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email • Upward</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        :root{
            --bg:#07191b;
            --panel:#0c2326;
            --panel-2:#112d31;

            --primary:#4ee3bd;
            --secondary:#62b3ff;

            --text:#f2fffb;
            --muted:#8fc8c0;

            --border:rgba(122,188,179,.22);
        }

        body{
            min-height:100vh;
            overflow:hidden;
            font-family:"Segoe UI",sans-serif;
            color:var(--text);
            background:var(--bg);
        }

        /* Background */

        .bg{
            position:fixed;
            inset:0;
            z-index:0;

            background:
            radial-gradient(circle at 15% 20%, rgba(78,227,189,.22), transparent 28%),
            radial-gradient(circle at 82% 12%, rgba(98,179,255,.18), transparent 26%),
            radial-gradient(circle at 85% 85%, rgba(255,202,102,.08), transparent 24%),
            linear-gradient(
                145deg,
                #07191b,
                #0f2c2f 48%,
                #081f25
            );
        }

        .bg::after{
            content:"";
            position:absolute;
            inset:0;

            background-image:
            linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);

            background-size:48px 48px;

            opacity:.7;
        }

        /* Layout */

        .page{
            position:relative;
            z-index:1;

            min-height:100vh;

            display:flex;
            align-items:center;
            justify-content:center;

            padding:24px;
        }

        /* Card */

        .verify-card{
            width:100%;
            max-width:500px;

            background:rgba(10,31,35,.78);

            border:1px solid var(--border);

            backdrop-filter:blur(18px);

            border-radius:28px;

            padding:42px;

            box-shadow:
            0 24px 80px rgba(0,0,0,.38),
            inset 0 1px 0 rgba(255,255,255,.05);
        }

        /* Logo */

        .logo-wrap{
            text-align:center;
            margin-bottom:28px;
        }

        .logo-box{
            width:76px;
            height:76px;

            margin:0 auto 18px;

            border-radius:22px;

            display:flex;
            align-items:center;
            justify-content:center;

            background:
            linear-gradient(
                135deg,
                var(--primary),
                var(--secondary)
            );

            color:#062124;

            font-size:1.8rem;
            font-weight:900;

            box-shadow:
            0 15px 40px rgba(78,227,189,.25);
        }

        .brand{
            font-size:2rem;
            font-weight:900;
            color:white;
            margin-bottom:6px;
        }

        .brand span{
            color:var(--primary);
        }

        .eyebrow{
            color:var(--secondary);
            font-size:.75rem;
            font-weight:800;
            letter-spacing:.14em;
            text-transform:uppercase;
        }

        /* Text */

        .title{
            text-align:center;
            font-size:2rem;
            font-weight:900;
            line-height:1.1;
            margin-bottom:10px;
        }

        .title span{
            color:var(--primary);
        }

        .subtitle{
            text-align:center;
            color:var(--muted);
            line-height:1.7;
            margin-bottom:28px;
        }

        /* Email Notice */

        .notice{
            display:flex;
            align-items:center;
            gap:12px;

            background:rgba(78,227,189,.08);

            border:1px solid rgba(78,227,189,.15);

            border-radius:16px;

            padding:14px;

            margin-bottom:22px;
        }

        .notice-icon{
            width:42px;
            height:42px;

            flex-shrink:0;

            display:flex;
            align-items:center;
            justify-content:center;

            border-radius:12px;

            background:rgba(78,227,189,.12);

            color:var(--primary);
            font-size:1.1rem;
            font-weight:900;
        }

        .notice-text{
            color:#b9ece4;
            font-size:.9rem;
            line-height:1.5;
        }

        /* Input */

        .form-control{
            height:78px;

            background:rgba(5,22,25,.88);

            border:1px solid rgba(122,188,179,.3);

            border-radius:18px;

            color:white;

            font-size:2rem;
            font-weight:800;

            text-align:center;

            letter-spacing:.55rem;
        }

        .form-control:focus{
            background:rgba(5,22,25,.88);

            color:white;

            border-color:var(--primary);

            box-shadow:
            0 0 0 4px rgba(78,227,189,.12);
        }

        .form-control::placeholder{
            color:#5f918b;
            letter-spacing:.3rem;
            font-size:1.2rem;
        }

        /* Error */

        .error-box{
            margin-top:14px;

            background:rgba(255,107,138,.08);

            border:1px solid rgba(255,107,138,.25);

            color:#ff9db1;

            padding:12px;

            border-radius:12px;

            text-align:center;
        }

        /* Button */

        .btn-main{
            width:100%;
            height:58px;

            border:none;

            margin-top:20px;

            border-radius:16px;

            font-weight:800;

            background:
            linear-gradient(
                90deg,
                var(--primary),
                var(--secondary)
            );

            color:#062124;

            transition:.2s;
        }

        .btn-main:hover{
            transform:translateY(-2px);
            filter:brightness(1.05);
        }

        /* Footer */

        .footer{
            text-align:center;
            margin-top:24px;

            color:#6fa59e;
            font-size:.9rem;
        }

        .footer a{
            color:var(--primary);
            text-decoration:none;
            font-weight:700;
        }

        .footer a:hover{
            color:white;
        }

        .resend{
            text-align:center;
            margin-top:18px;
        }

        .resend button{
            background:none;
            border:none;

            color:#62b3ff;

            font-size:.9rem;
            font-weight:700;
        }

        .resend button:hover{
            color:white;
        }

</head>
<body>

    <div class="bg"></div>

    <main class="page">

        <section class="verify-card">

            <div class="logo-wrap">

                <!-- Replace later with your custom icon -->

                <div class="logo-box">
                    ✓
                </div>

                <div class="eyebrow">
                    Account Security
                </div>

                <h1 class="brand">
                    Up<span>ward</span>
                </h1>

            </div>

            <h2 class="title">
                Verify your <span>email</span>
            </h2>

            <p class="subtitle">
                We sent a secure 6-digit verification code to your inbox.
                Enter it below to activate your account.
            </p>

            <div class="notice">
                <div class="notice-icon">
                    @
                </div>

                <div class="notice-text">
                    Check your inbox and spam folder if you don't see the email within a minute.
                </div>
            </div>

            <form action="/verify" method="POST">

                <div class="mb-3">
                    <input
                        type="text"
                        name="code"
                        maxlength="6"
                        required
                        class="form-control"
                        placeholder="000000"
                        autocomplete="one-time-code"
                    >
                </div>

                {% if error %}
                    <div class="error-box">
                        {{ error }}
                    </div>
                {% endif %}

                <button type="submit" class="btn-main">
                    Verify Account
                </button>

            </form>

            <div class="resend">
                <button type="button">
                    Resend Code
                </button>
            </div>

            <div class="footer">
                Wrong email?
                <a href="/register">
                    Go back
                </a>
            </div>

        </section>

    </main>

</body>
