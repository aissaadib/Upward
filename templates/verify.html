<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify – Upward</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0d2b2e; font-family: 'Segoe UI', sans-serif; }
        .card { border: 1.5px solid #1a5c5a; background: #112f32; width: 100%; max-width: 400px; }
        .btn-main { background: #2ec4a0; border: none; color: #0d2b2e; font-weight: 700; }
        .btn-main:hover { background: #25a98a; color: #0d2b2e; }
        .form-control { border: 1.5px solid #1a5c5a; background: #0d2b2e; color: #c8f5ee; font-size: 1.5rem; text-align: center; letter-spacing: 0.5rem; }
        .form-control::placeholder { color: #4a8f8a; letter-spacing: normal; font-size: 1rem; }
        .form-control:focus { border-color: #2ec4a0; box-shadow: 0 0 0 0.2rem rgba(46,196,160,0.2); background: #0d2b2e; color: #c8f5ee; }
        .brand { color: #c8f5ee; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; }
        .brand span { color: #2ec4a0; }
        a { color: #2ec4a0; }
    </style>
</head>
<body class="min-vh-100 d-flex align-items-center justify-content-center p-3">
    <div class="card p-4 rounded-4 shadow-lg text-center">
        <h1 class="brand mb-1">Up<span>ward</span></h1>
        <p style="color:#4a8f8a; font-size:.9rem;" class="mb-1">Check your email</p>
        <p style="color:#7eeedd; font-size:.85rem;" class="mb-4">We sent a 6-digit code to your email address</p>
        <form action="/verify" method="POST">
            <div class="mb-3">
                <input type="text" name="code" class="form-control rounded-3" placeholder="000000" maxlength="6" required>
            </div>
            {% if error %}
                <p style="color:#ff6b8a;" class="text-center small">{{ error }}</p>
            {% endif %}
            <button type="submit" class="btn btn-main w-100 rounded-3">Verify</button>
        </form>
        <p class="mt-3 mb-0 small" style="color:#4a8f8a;">
            Wrong email? <a href="/register">Go back</a>
        </p>
    </div>
</body>
</html>
