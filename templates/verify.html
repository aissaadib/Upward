<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Email - Upward</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="page-verify page-auth">

<div class="container">

<div class="logo-wrap">

    <div class="logo-box">
        ✓
    </div>

    <h1 class="brand">
        Up<span>ward</span>
    </h1>

</div>

<h2 class="title">
    Verify your <span>email</span>
</h2>

<p class="subtitle">
    We sent a secure 6-digit verification code to your email address.
    Enter it below to activate your account.
</p>

<div class="notice">
    Check your inbox and spam folder if you don't see the email within a minute.
</div>

<form action="/verify" method="POST">

    {{ csrf_input|safe }}

    <div class="mb-3">
        <input
            type="text"
            name="code"
            maxlength="6"
            required
            class="form-control"
            placeholder="000000"
            autocomplete="one-time-code">
    </div>

    {% if error %}
    <div class="error-box">
        {{ error }}
    </div>
    {% endif %}

    <button type="submit" class="btn-main">
        Verify Account
    </button>

</form>

<div class="resend">
    <button type="button">
        Resend Code
    </button>
</div>

<div class="footer">
    Wrong email?
    <a href="/register">
        Go back
    </a>
</div>

</body>
</html>
