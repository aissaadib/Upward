<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Upward</title>



<link rel="stylesheet" href="/static/micro.css">
    <link rel="stylesheet" href="/static/login.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js" crossorigin="anonymous" defer></script>
    <script src="/static/animations.js" defer></script>
<link rel="stylesheet" href="/static/brand.css">
</head>

<body>

<div class="container">

    <h1 class="brand">
        UPWARD<span>®</span>
    </h1>

    <p class="subtitle">
        Welcome back.
    </p>

    <form action="/login" method="POST">

        {{ csrf_input|safe }}

        <div class="form-group">
            <input
                type="email"
                name="email"
                placeholder="Email"
                required>
        </div>

        <div class="form-group">
            <input
                type="password"
                name="password"
                placeholder="Password"
                required>
        </div>

        {% if error %}
        <p class="error">
            {{ error }}
        </p>
        {% endif %}

        <button class="btn" type="submit">
            Continue
        </button>

    </form>

    <p class="footer">
        Don't have an account?
        <a href="/register">Create one</a>
    </p>

</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js" defer></script>
<script src="/static/brand.js" defer></script>
</body>
</html>
