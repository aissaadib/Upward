<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Upward</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0d2b2e; font-family: 'Segoe UI', sans-serif; }
        .card { border: 1.5px solid #1a5c5a; background: #112f32; width: 100%; max-width: 400px; }
        .btn-main { background: #2ec4a0; border: none; color: #0d2b2e; font-weight: 700; }
        .btn-main:hover { background: #25a98a; color: #0d2b2e; }
        .form-control { border: 1.5px solid #1a5c5a; background: #0d2b2e; color: #c8f5ee; }
        .form-control::placeholder { color: #4a8f8a; }
        .form-control:focus { border-color: #2ec4a0; box-shadow: 0 0 0 0.2rem rgba(46,196,160,0.2); background: #0d2b2e; color: #c8f5ee; }
        .brand { color: #c8f5ee; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; }
        .brand span { color: #2ec4a0; }
        a { color: #2ec4a0; }
        a:hover { color: #7eeedd; }
    </style>
</head>
<body class="min-vh-100 d-flex align-items-center justify-content-center p-3">
    <div class="card p-4 rounded-4 shadow-lg">
        <h1 class="text-center brand mb-1">Up<span>ward</span></h1>
        <p class="text-center mb-4" style="color:#4a8f8a;font-size:.9rem;">Welcome back</p>
        <form action="/login" method="POST">
            <div class="mb-3">
                <input type="email" name="email" class="form-control rounded-3" placeholder="Email" required>
            </div>
            <div class="mb-3">
                <input type="password" name="password" class="form-control rounded-3" placeholder="Password" required>
            </div>
            {% if error %}
                <p style="color:#ff6b8a;" class="text-center small">{{ error }}</p>
            {% endif %}
            <button type="submit" class="btn btn-main w-100 rounded-3">Login</button>
        </form>
        <p class="text-center mt-3 mb-0 small" style="color:#4a8f8a;">
            Don't have an account? <a href="/register">Register</a>
        </p>
    </div>
</body>
</html>
