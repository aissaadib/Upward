<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Upward</title>

<link rel="stylesheet" href="/static/style.css">
</head>

<body class="page-login page-auth">

<div class="container">

    <h1 class="brand">
        Up<span>ward</span>
    </h1>

    <p class="subtitle">
        Welcome back.
    </p>

    <form action="/login" method="POST">

        {{ csrf_input|safe }}

        <div class="form-group">
            <input
                type="email"
                name="email"
                placeholder="Email"
                required>
        </div>

        <div class="form-group">
            <input
                type="password"
                name="password"
                placeholder="Password"
                required>
        </div>

        {% if error %}
        <p class="error">
            {{ error }}
        </p>
        {% endif %}

        <button class="btn" type="submit">
            Continue
        </button>

    </form>

    <p class="footer">
        Don't have an account?
        <a href="/register">Create one</a>
    </p>

</div>

</body>
</html>
