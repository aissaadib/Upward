<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Upward</title>

<style>

:root{
    --accent:#3ec3d5;
    --bg:#f7f7fa;
    --text:#1e2240;
    --text-secondary:#6b7280;
    --border:#e1e0e6;
    --sidebar:#23273c;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    font-family:Inter,Segoe UI,sans-serif;
    color:var(--text);
}

.container{
    width:min(420px,90%);
    margin:auto;
    padding-top:12vh;
}

.brand{
    font-size:2rem;
    font-weight:900;
    letter-spacing:-1px;
}

.brand span{
    color:var(--accent);
}

.subtitle{
    color:var(--text-secondary);
    margin-top:8px;
    margin-bottom:40px;
}

.form-group{
    margin-bottom:18px;
}

input{
    width:100%;
    padding:14px 16px;

    border:1px solid var(--border);
    border-radius:12px;

    background:white;

    font-size:.95rem;
}

input:focus{
    outline:none;
    border-color:var(--accent);
}

.btn{
    width:100%;
    border:none;

    padding:14px;

    border-radius:12px;

    background:var(--sidebar);
    color:white;

    font-weight:700;
    cursor:pointer;

    margin-top:10px;
}

.btn:hover{
    opacity:.95;
}

.error{
    color:#d33;
    margin-bottom:14px;
    font-size:.9rem;
}

.footer{
    margin-top:24px;
    text-align:center;
    color:var(--text-secondary);
}

.footer a{
    color:var(--accent);
    text-decoration:none;
}

</style>

<link rel="stylesheet" href="/static/micro.css">
</head>

<body>

<div class="container">

    <h1 class="brand">
        Up<span>ward</span>
    </h1>

    <p class="subtitle">
        Welcome back.
    </p>

    <form action="/login" method="POST">

        {{ csrf_input|safe }}

        <div class="form-group">
            <input
                type="email"
                name="email"
                placeholder="Email"
                required>
        </div>

        <div class="form-group">
            <input
                type="password"
                name="password"
                placeholder="Password"
                required>
        </div>

        {% if error %}
        <p class="error">
            {{ error }}
        </p>
        {% endif %}

        <button class="btn" type="submit">
            Continue
        </button>

    </form>

    <p class="footer">
        Don't have an account?
        <a href="/register">Create one</a>
    </p>

</div>

</body>
</html>
