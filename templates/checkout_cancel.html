<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Cancelled - Upward</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,Segoe UI,sans-serif;background:#f7f7fa;color:#1e2240;display:flex;align-items:center;justify-content:center;min-height:100vh;}
.card{background:white;border-radius:16px;padding:48px;text-align:center;max-width:480px;width:90%;box-shadow:0 4px 20px rgba(0,0,0,.06);}
.icon{width:64px;height:64px;background:#fde8ea;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:1.8rem;color:#c81e2e;font-weight:700;}
h1{font-size:1.8rem;margin-bottom:8px;}
p{color:#6b7280;margin-bottom:24px;line-height:1.6;}
.btn{display:inline-block;background:#3ec3d5;color:white;border:none;padding:12px 28px;border-radius:10px;font-weight:700;font-size:.9rem;cursor:pointer;text-decoration:none;transition:.2s;}
.btn:hover{background:#2eb3c5;}
</style>
</head>
<body>
<div class="card">
<div class="icon">✕</div>
<h1>Payment Cancelled</h1>
<p>You cancelled the payment. No charges were made. You can try again whenever you're ready.</p>
<a href="/courses" class="btn">Back to Courses</a>
</div>
</body>
</html>
