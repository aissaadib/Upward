<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Upward</title>
<style>
:root{
    --sidebar:#23273c;
    --accent:#3ec3d5;
    --success:#41dc65;
    --danger:#ff5460;
    --bg:#f7f7fa;
    --text:#1e2240;
    --text-secondary:#6b7280;
    --border:#e1e0e6;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,Segoe UI,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}
.navbar{height:70px;display:flex;justify-content:space-between;align-items:center;padding:0 32px;border-bottom:1px solid var(--border);background:white;position:sticky;top:0;z-index:100;}
.nav-left{display:flex;align-items:center;gap:20px;}
.brand{font-size:1.8rem;font-weight:900;letter-spacing:-1px;text-decoration:none;color:inherit;}
.brand span{color:var(--accent);}
.nav-link{margin-top:3px;font-size:1.5rem;font-weight:900;letter-spacing:-1px;text-decoration:none;color:inherit;}
.nav-link:hover{color:var(--accent);}
.nav-right{display:flex;align-items:center;gap:14px;}
.username{font-size:.9rem;font-weight:700;}
.logout{text-decoration:none;color:var(--text-secondary);font-size:.9rem;}
.logout:hover{color:var(--accent);}
.container{width:min(1100px,90%);margin:auto;}
.hero{padding:60px 0 20px;}
.hero h1{font-size:clamp(2.2rem,6vw,3rem);letter-spacing:-1.5px;}
.hero p{margin-top:12px;max-width:650px;color:var(--text-secondary);font-size:1.05rem;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;margin:30px 0;}
.card{background:white;border:1px solid var(--border);border-radius:16px;padding:24px;text-align:center;}
.card h2{font-size:2rem;margin-bottom:6px;}
.card p{color:var(--text-secondary);font-size:.9rem;}
.nav-links{display:flex;gap:12px;margin:20px 0;}
.nav-links a{padding:10px 20px;border:1px solid var(--border);border-radius:10px;text-decoration:none;color:var(--text);font-weight:600;font-size:.9rem;background:white;transition:.2s;}
.nav-links a:hover{border-color:var(--accent);color:var(--accent);}
@media(max-width:768px){.navbar{padding:0 18px;}.nav-left{gap:14px;}}
</style>
</head>
<body>
<nav class="navbar">
    <div class="nav-left">
        <a href="/" class="brand">Up<span>ward</span></a>
        <a href="/courses" class="nav-link">Courses</a>
        <a href="/admin" class="nav-link" style="color:var(--accent);">Admin</a>
    </div>
    <div class="nav-right">
        <span class="username">{{ username }}</span>
        <a href="/logout" class="logout">Logout</a>
    </div>
</nav>
<main class="container">
    <section class="hero">
        <h1>Admin Dashboard</h1>
        <p>Manage courses, view purchases, and monitor platform activity.</p>
    </section>
    <div class="grid">
        <div class="card"><h2>{{ course_count }}</h2><p>Courses</p></div>
        <div class="card"><h2>{{ user_count }}</h2><p>Users</p></div>
        <div class="card"><h2>{{ purchase_count }}</h2><p>Purchases</p></div>
        <div class="card"><h2>{{ "%.0f"|format(total_revenue / 100) }} MAD</h2><p>Revenue</p></div>
    </div>
    <div class="nav-links">
        <a href="/admin/courses">Manage Courses</a>
        <a href="/admin/purchases">View Purchases</a>
    </div>
</main>
</body>
</html>
