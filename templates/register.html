<form action="/register" method="POST">

    <div class="form-group">
        <input
            type="text"
            name="username"
            placeholder="Username"
            required>
    </div>

    <div class="form-group">
        <input
            type="email"
            name="email"
            placeholder="Email"
            required>
    </div>

    <div class="form-group">
        <input
            type="password"
            name="password"
            placeholder="Password"
            required>
    </div>

    <div class="form-group">
        <input
            type="password"
            name="confirmation"
            placeholder="Confirm password"
            required>
    </div>

    {% if error %}
    <p class="error">
        {{ error }}
    </p>
    {% endif %}

    <button class="btn" type="submit">
        Create account
    </button>

</form>
