<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Upward</title>



<link rel="stylesheet" href="/static/micro.css">
    <link rel="stylesheet" href="/static/register.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js" crossorigin="anonymous" defer></script>
    <script src="/static/animations.js" defer></script>
<link rel="stylesheet" href="/static/brand.css">
</head>

<body>

<div class="container">

    <h1 class="brand">
        UPWARD<span>®</span>
    </h1>

    <p class="subtitle">
        Create your account.
    </p>

    <form action="/register" method="POST" enctype="multipart/form-data">

        {{ csrf_input|safe }}

        <div class="form-group">
            <input
                type="text"
                name="username"
                placeholder="Username"
                autocomplete="username"
                required>
        </div>

        <div class="form-group">
            <input
                type="email"
                name="email"
                placeholder="Email address"
                autocomplete="email"
                required>
        </div>

        <div class="form-group">
            <input
                type="password"
                name="password"
                placeholder="Password"
                autocomplete="new-password"
                required>
        </div>

        <div class="form-group">
            <input
                type="password"
                name="confirmation"
                placeholder="Confirm password"
                autocomplete="new-password"
                required>
        </div>

        <div class="form-group" style="margin-bottom:14px;">
            <label style="display:block;font-size:.85rem;font-weight:600;margin-bottom:6px;color:var(--text-secondary);">Resume / CV (PDF)</label>
            <input type="file" name="resume" accept=".pdf" class="file-input" id="resume-input" required onchange="document.getElementById('resume-name').textContent=this.files[0]?.name||'';document.getElementById('resume-btn').textContent=this.files[0]?'Change file':'Choose PDF file'">
            <button type="button" class="file-upload-btn" id="resume-btn" onclick="document.getElementById('resume-input').click()">Choose PDF file</button>
            <p class="file-name" id="resume-name"></p>
        </div>

        {% if error %}
        <p class="error">
            {{ error }}
        </p>
        {% endif %}

        <button class="btn" type="submit">
            Create Account
        </button>

    </form>

    <p class="footer">
        Already have an account?
        <a href="/login">Login</a>
    </p>

</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js" defer></script>
<script src="/static/brand.js" defer></script>
</body>
</html>
