<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Upward</title>

<style>

:root{
    --accent:#3ec3d5;
    --bg:#f7f7fa;
    --text:#1e2240;
    --text-secondary:#6b7280;
    --border:#e1e0e6;
    --sidebar:#23273c;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    font-family:Inter,Segoe UI,sans-serif;
    color:var(--text);
}

.container{
    width:min(420px,90%);
    margin:auto;
    padding-top:12vh;
}

.brand{
    font-size:2rem;
    font-weight:900;
    letter-spacing:-1px;
}

.brand span{
    color:var(--accent);
}

.subtitle{
    color:var(--text-secondary);
    margin-top:8px;
    margin-bottom:40px;
}

.form-group{
    margin-bottom:18px;
}

input:not([type="file"]){
    width:100%;
    padding:14px 16px;
    border:1px solid var(--border);
    border-radius:12px;
    background:white;
    font-size:.95rem;
}

input:not([type="file"]):focus{
    outline:none;
    border-color:var(--accent);
}

.file-input{display:none;}
.file-upload-btn{width:100%;padding:14px 16px;border:1.5px solid var(--border);border-radius:8px;background:white;font-size:.95rem;color:var(--text);outline:none;margin-top:4px;cursor:pointer;text-align:center;font-weight:600;transition:.15s;}
.file-upload-btn:hover{border-color:var(--accent);}
.file-name{font-size:.85rem;color:var(--accent);font-weight:600;margin-top:8px;}

.btn{
    width:100%;
    border:none;
    padding:14px;
    border-radius:12px;
    background:var(--sidebar);
    color:white;
    font-weight:700;
    cursor:pointer;
    margin-top:10px;
}

.btn:hover{
    opacity:.95;
}

.error{
    color:#d33;
    margin-bottom:14px;
    font-size:.9rem;
}

.footer{
    margin-top:24px;
    text-align:center;
    color:var(--text-secondary);
}

.footer a{
    color:var(--accent);
    text-decoration:none;
}

</style>
</head>

<body>

<div class="container">

    <h1 class="brand">
        Up<span>ward</span>
    </h1>

    <p class="subtitle">
        Create your account.
    </p>

    <form action="/register" method="POST" enctype="multipart/form-data">

        {{ csrf_input|safe }}

        <div class="form-group">
            <input
                type="text"
                name="username"
                placeholder="Username"
                autocomplete="username"
                required>
        </div>

        <div class="form-group">
            <input
                type="email"
                name="email"
                placeholder="Email address"
                autocomplete="email"
                required>
        </div>

        <div class="form-group">
            <input
                type="password"
                name="password"
                placeholder="Password"
                autocomplete="new-password"
                required>
        </div>

        <div class="form-group">
            <input
                type="password"
                name="confirmation"
                placeholder="Confirm password"
                autocomplete="new-password"
                required>
        </div>

        <div class="form-group" style="margin-bottom:14px;">
            <label style="display:block;font-size:.85rem;font-weight:600;margin-bottom:6px;color:var(--text-secondary);">Resume / CV (PDF)</label>
            <input type="file" name="resume" accept=".pdf" class="file-input" id="resume-input" required onchange="document.getElementById('resume-name').textContent=this.files[0]?.name||'';document.getElementById('resume-btn').textContent=this.files[0]?'Change file':'Choose PDF file'">
            <button type="button" class="file-upload-btn" id="resume-btn" onclick="document.getElementById('resume-input').click()">Choose PDF file</button>
            <p class="file-name" id="resume-name"></p>
        </div>

        {% if error %}
        <p class="error">
            {{ error }}
        </p>
        {% endif %}

        <button class="btn" type="submit">
            Create Account
        </button>

    </form>

    <p class="footer">
        Already have an account?
        <a href="/login">Login</a>
    </p>

</div>

</body>
</html>
