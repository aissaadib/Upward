<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Lesson - {{ course.title }}</title>

<style>
:root{
    --accent:#3ec3d5;
    --bg:#f7f7fa;
    --text:#1e2240;
    --text-secondary:#6b7280;
    --border:#e1e0e6;
    --sidebar:#23273c;
    --danger:#ff5460;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

a:hover{
    text-decoration:underline;
}

.brand a:hover{
    text-decoration:none;
}

body{
    background:var(--bg);
    font-family:Inter,Segoe UI,sans-serif;
    color:var(--text);
    min-height:100vh;
    padding:40px 20px;
}

.container{
    max-width:900px;
    margin:0 auto;
}

.logo-wrap{
    text-align:center;
    margin-bottom:32px;
}

.brand{
    font-size:2rem;
    font-weight:900;
    letter-spacing:-1px;
}

.brand a{
    text-decoration:none;
    color:inherit;
}

.brand span{
    color:var(--accent);
}

.title{
    text-align:center;
    font-size:1.8rem;
    font-weight:800;
    margin-bottom:10px;
}

.title span{
    color:var(--accent);
}

.subtitle{
    text-align:center;
    color:var(--text-secondary);
    line-height:1.6;
    margin-bottom:28px;
}

.breadcrumb{
    text-align:center;
    font-size:.85rem;
    color:var(--text-secondary);
    margin-bottom:20px;
}

.breadcrumb a{
    color:var(--accent);
    text-decoration:none;
    font-weight:700;
}

.breadcrumb a:hover{
    text-decoration:underline;
}

.notice{
    background:#f8fbfc;
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    margin-bottom:24px;
    text-align:center;
    color:var(--text-secondary);
    font-size:.95rem;
    line-height:1.5;
}

.form-group{
    margin-bottom:20px;
}

.form-label{
    display:block;
    font-weight:700;
    margin-bottom:8px;
    color:var(--text);
}

.form-control{
    width:100%;
    padding:14px 16px;
    border:1px solid var(--border);
    border-radius:12px;
    background:white;
    font-size:.95rem;
    font-family:Inter,Segoe UI,sans-serif;
}

.form-control:focus{
    outline:none;
    border-color:var(--accent);
}

textarea.form-control{
    min-height:140px;
    resize:vertical;
}

.file-upload{
    width:100%;
    padding:24px;
    border:2px dashed var(--border);
    border-radius:12px;
    background:#f8fbfc;
    text-align:center;
    cursor:pointer;
    transition:.2s;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:120px;
}

.file-upload:hover{
    border-color:var(--accent);
    background:#eefcff;
}

.file-upload input{
    display:none;
}

.file-upload-text{
    color:var(--text-secondary);
    font-size:.9rem;
}

.file-upload-text strong{
    color:var(--accent);
}

.toolbar{
    display:flex;
    gap:4px;
    padding:8px 10px;
    border:1px solid var(--border);
    border-bottom:none;
    border-radius:12px 12px 0 0;
    background:#f8fbfc;
    flex-wrap:wrap;
}

.toolbar button{
    width:34px;
    height:34px;
    border:none;
    border-radius:6px;
    background:transparent;
    color:var(--text-secondary);
    font-weight:700;
    font-size:.85rem;
    cursor:pointer;
    transition:.15s;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.toolbar button:hover{
    background:var(--border);
    color:var(--text);
}

.toolbar button.active{
    background:var(--accent);
    color:white;
}

.toolbar .separator{
    width:1px;
    background:var(--border);
    margin:0 4px;
    flex-shrink:0;
}

.toolbar select{
    height:30px;
    border:1px solid var(--border);
    border-radius:6px;
    background:white;
    color:var(--text);
    font-size:.8rem;
    padding:0 6px;
    cursor:pointer;
    outline:none;
    flex-shrink:0;
}

.toolbar select:focus{
    border-color:var(--accent);
}

.toolbar input[type="color"]{
    width:30px;
    height:30px;
    padding:2px;
    border:1px solid var(--border);
    border-radius:6px;
    cursor:pointer;
    background:white;
    flex-shrink:0;
}

.toolbar input[type="color"]:hover{
    border-color:var(--accent);
}

.toolbar .label{
    font-size:.75rem;
    font-weight:600;
    color:var(--text-secondary);
    display:flex;
    align-items:center;
    margin-right:2px;
}

.editor{
    min-height:500px;
    padding:16px 20px;
    border:1px solid var(--border);
    border-radius:0 0 12px 12px;
    background:white;
    font-size:1rem;
    font-family:Inter,Segoe UI,sans-serif;
    line-height:1.8;
    outline:none;
    overflow-y:auto;
}

.editor:focus{
    border-color:var(--accent);
}

.editor ul, .editor ol{
    padding-left:24px;
    margin:8px 0;
}

.editor blockquote{
    border-left:3px solid var(--accent);
    padding-left:14px;
    margin:12px 0;
    color:var(--text-secondary);
    font-style:italic;
}

.editor.empty::before{
    content:attr(data-placeholder);
    color:var(--text-secondary);
    opacity:.5;
    pointer-events:none;
}

.btn-main{
    width:100%;
    border:none;
    padding:14px;
    margin-top:16px;
    border-radius:12px;
    background:var(--sidebar);
    color:white;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
    font-size:.95rem;
}

.btn-main:hover{
    opacity:.95;
}

.btn-secondary{
    display:inline-block;
    padding:10px 20px;
    border-radius:10px;
    font-weight:700;
    text-decoration:none;
    cursor:pointer;
    border:1.5px solid var(--border);
    background:white;
    color:var(--text);
    font-size:.9rem;
    transition:.2s;
}

.btn-secondary:hover{
    border-color:var(--accent);
}

.error-box{
    background:#fff5f5;
    color:#dc2626;
    border:1px solid #fecaca;
    border-radius:12px;
    padding:12px;
    margin-bottom:20px;
    text-align:center;
}

.footer{
    margin-top:24px;
    text-align:center;
    color:var(--text-secondary);
}

.footer a{
    color:var(--accent);
    text-decoration:none;
}

@media (max-width:600px){
    .title{
        font-size:1.5rem;
    }
}

</style>
</head>

<body>

<div class="container">

<div class="logo-wrap">
    <h1 class="brand">
        <a href="/">
            Up<span>ward</span>
        </a>
    </h1>
</div>

<div class="breadcrumb">
    <a href="/courses">Courses</a> /
    <a href="/lessons/{{ course.id }}">{{ course.title }}</a> /
    Add Lesson
</div>

<h2 class="title">Add a <span>Lesson</span></h2>
<p class="subtitle">
    Create a new lesson for <strong>{{ course.title }}</strong>.
    Enter a title, add content directly, or upload a PDF/TXT file.
</p>

{% if error %}
<div class="error-box">
    {{ error }}
</div>
{% endif %}

<form method="POST" action="/create_lesson/{{ course.id }}" enctype="multipart/form-data">

    <div class="form-group">
        <label class="form-label">Lesson Title</label>
        <input type="text" name="title" class="form-control" placeholder="e.g., Introduction to Variables" required>
    </div>

    <div class="form-group">
        <label class="form-label">Content</label>
        <div class="toolbar">
            <select id="fontFamily" title="Font">
                <option value="Inter,Segoe UI,sans-serif">Default</option>
                <option value="Arial,Helvetica,sans-serif">Arial</option>
                <option value="Georgia,serif">Georgia</option>
                <option value="'Times New Roman',serif">Times New Roman</option>
                <option value="'Courier New',monospace">Courier New</option>
                <option value="Verdana,sans-serif">Verdana</option>
                <option value="'Trebuchet MS',sans-serif">Trebuchet MS</option>
                <option value="'Comic Sans MS',cursive">Comic Sans</option>
            </select>
            <select id="fontSize" title="Font Size">
                <option value="3">Small</option>
                <option value="4" selected>Normal</option>
                <option value="5">Large</option>
                <option value="6">X-Large</option>
                <option value="7">Huge</option>
            </select>
            <div class="separator"></div>
            <button type="button" data-cmd="bold" title="Bold"><strong>B</strong></button>
            <button type="button" data-cmd="italic" title="Italic"><em>I</em></button>
            <button type="button" data-cmd="underline" title="Underline"><u>U</u></button>
            <button type="button" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
            <div class="separator"></div>
            <span class="label">Color</span>
            <input type="color" id="textColor" value="#1e2240" title="Text Color">
            <span class="label">Bg</span>
            <input type="color" id="bgColor" value="#ffff00" title="Background Color">
            <div class="separator"></div>
            <button type="button" data-cmd="formatBlock" data-val="h1" title="Heading 1">H1</button>
            <button type="button" data-cmd="formatBlock" data-val="h2" title="Heading 2">H2</button>
            <button type="button" data-cmd="formatBlock" data-val="h3" title="Heading 3">H3</button>
            <button type="button" data-cmd="formatBlock" data-val="h4" title="Heading 4">H4</button>
            <div class="separator"></div>
            <button type="button" data-cmd="insertUnorderedList" title="Bullet List">•</button>
            <button type="button" data-cmd="insertOrderedList" title="Numbered List">1.</button>
            <div class="separator"></div>
            <button type="button" data-cmd="justifyLeft" title="Align Left">≡</button>
            <button type="button" data-cmd="justifyCenter" title="Align Center">≡</button>
            <button type="button" data-cmd="justifyRight" title="Align Right">≡</button>
            <div class="separator"></div>
            <button type="button" data-cmd="formatBlock" data-val="blockquote" title="Quote">“</button>
            <button type="button" data-cmd="insertHorizontalRule" title="Horizontal Line">—</button>
            <div class="separator"></div>
            <button type="button" data-cmd="removeFormat" title="Clear Formatting">↺</button>
        </div>
        <div class="editor" contenteditable="true" id="lessonEditor"></div>
        <input type="hidden" name="content" id="contentHidden">
    </div>

    <div class="form-group">
        <label class="form-label">Upload Lesson File (PDF or TXT)</label>
        <label class="file-upload" id="fileDropZone">
            <input type="file" name="lesson_pdf" accept=".pdf,.txt" id="lessonInput">
            <div class="file-upload-text" id="fileUploadText">
                <strong>Click to upload</strong> or drag and drop
            </div>
        </label>
        <button type="button" id="extractBtn" class="btn-secondary" style="margin-top:10px;" disabled>⏎ Confirm &amp; Extract to Editor</button>
    </div>

    <button type="submit" class="btn-main">Create Lesson</button>

</form>

<div class="footer">
    <a href="/lessons/{{ course.id }}">← Back to {{ course.title }}</a>
</div>

</div>

<script>
const editor = document.getElementById('lessonEditor');
const contentHidden = document.getElementById('contentHidden');
const form = document.querySelector('form');
const fileInput = document.getElementById('lessonInput');
const fileDropZone = document.getElementById('fileDropZone');
const fileUploadText = document.getElementById('fileUploadText');

// Placeholder
editor.dataset.placeholder = 'Write your lesson content here...';
editor.addEventListener('focus', () => editor.classList.remove('empty'));
editor.addEventListener('blur', () => {
    if (!editor.innerText.trim()) editor.classList.add('empty');
});
if (!editor.innerText.trim()) editor.classList.add('empty');

// Toolbar buttons
document.querySelectorAll('.toolbar button[data-cmd]').forEach(btn => {
    btn.addEventListener('click', () => {
        const cmd = btn.dataset.cmd;
        const val = btn.dataset.val || null;
        document.execCommand(cmd, false, val);
        editor.focus();
    });
});

// Font family
document.getElementById('fontFamily').addEventListener('change', function() {
    document.execCommand('fontName', false, this.value);
    editor.focus();
    this.selectedIndex = 0;
});

// Font size
document.getElementById('fontSize').addEventListener('change', function() {
    document.execCommand('fontSize', false, this.value);
    editor.focus();
    this.selectedIndex = 1;
});

// Text color
document.getElementById('textColor').addEventListener('input', function() {
    document.execCommand('foreColor', false, this.value);
    editor.focus();
});

// Background color
document.getElementById('bgColor').addEventListener('input', function() {
    document.execCommand('hiliteColor', false, this.value);
    editor.focus();
});

// Sync hidden input on submit
form.addEventListener('submit', function(e) {
    contentHidden.value = editor.innerHTML;
});

const extractBtn = document.getElementById('extractBtn');

// File input - just show filename, no auto-extract
fileInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
        fileUploadText.innerHTML = '<strong>' + file.name + '</strong>';
        fileDropZone.style.borderColor = 'var(--accent)';
        fileDropZone.style.background = '#eefcff';
        extractBtn.disabled = false;
    } else {
        extractBtn.disabled = true;
    }
});

// Confirm button - AI extract PDF/TXT into editor
extractBtn.addEventListener('click', function() {
    const file = fileInput.files[0];
    if (!file) return;
    extractBtn.disabled = true;
    extractBtn.textContent = '⏳ Extracting...';
    const fd = new FormData();
    fd.append('file', file);
    editor.innerHTML = '<p style="color:var(--text-secondary);">⏳ Extracting and formatting content...</p>';
    editor.classList.remove('empty');

    fetch('/api/extract_lesson', { method: 'POST', body: fd })
        .then(r => r.json())
        .then(data => {
            if (data.html) {
                editor.innerHTML = data.html;
            } else if (data.error) {
                editor.innerHTML = '<p style="color:red;">Error: ' + data.error + '</p>';
            }
        })
        .catch(() => {
            editor.innerHTML = '<p style="color:red;">Failed to process file.</p>';
        })
        .finally(() => {
            extractBtn.textContent = '⏎ Confirm & Extract to Editor';
        });
});

// Drag and drop
fileDropZone.addEventListener('dragover', function(e) {
    e.preventDefault();
    fileDropZone.style.borderColor = 'var(--accent)';
    fileDropZone.style.background = '#eefcff';
});

fileDropZone.addEventListener('dragleave', function(e) {
    e.preventDefault();
    fileDropZone.style.borderColor = 'var(--border)';
    fileDropZone.style.background = '#f8fbfc';
});

fileDropZone.addEventListener('drop', function(e) {
    e.preventDefault();
    fileDropZone.style.borderColor = 'var(--accent)';
    fileDropZone.style.background = '#eefcff';
    if (e.dataTransfer.files.length > 0) {
        fileInput.files = e.dataTransfer.files;
        fileUploadText.innerHTML = '<strong>' + e.dataTransfer.files[0].name + '</strong>';
        extractBtn.disabled = false;
    }
});
</script>

</body>
</html>
