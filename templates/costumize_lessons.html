<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Lesson - {{ course.title }}</title>

<style>
:root{
    --accent:#3ec3d5;
    --bg:#f7f7fa;
    --text:#1e2240;
    --text-secondary:#6b7280;
    --border:#e1e0e6;
    --sidebar:#23273c;
    --danger:#ff5460;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

a:hover{
    text-decoration:underline;
}

.brand a:hover{
    text-decoration:none;
}

body{
    background:var(--bg);
    font-family:Inter,Segoe UI,sans-serif;
    color:var(--text);
    min-height:100vh;
    padding:40px 20px;
}

.container{
    max-width:640px;
    margin:0 auto;
}

.logo-wrap{
    text-align:center;
    margin-bottom:32px;
}

.brand{
    font-size:2rem;
    font-weight:900;
    letter-spacing:-1px;
}

.brand a{
    text-decoration:none;
    color:inherit;
}

.brand span{
    color:var(--accent);
}

.title{
    text-align:center;
    font-size:1.8rem;
    font-weight:800;
    margin-bottom:10px;
}

.title span{
    color:var(--accent);
}

.subtitle{
    text-align:center;
    color:var(--text-secondary);
    line-height:1.6;
    margin-bottom:28px;
}

.breadcrumb{
    text-align:center;
    font-size:.85rem;
    color:var(--text-secondary);
    margin-bottom:20px;
}

.breadcrumb a{
    color:var(--accent);
    text-decoration:none;
    font-weight:700;
}

.breadcrumb a:hover{
    text-decoration:underline;
}

.notice{
    background:#f8fbfc;
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    margin-bottom:24px;
    text-align:center;
    color:var(--text-secondary);
    font-size:.95rem;
    line-height:1.5;
}

.form-group{
    margin-bottom:20px;
}

.form-label{
    display:block;
    font-weight:700;
    margin-bottom:8px;
    color:var(--text);
}

.form-control{
    width:100%;
    padding:14px 16px;
    border:1px solid var(--border);
    border-radius:12px;
    background:white;
    font-size:.95rem;
    font-family:Inter,Segoe UI,sans-serif;
}

.form-control:focus{
    outline:none;
    border-color:var(--accent);
}

textarea.form-control{
    min-height:140px;
    resize:vertical;
}

.file-upload{
    width:100%;
    padding:24px;
    border:2px dashed var(--border);
    border-radius:12px;
    background:#f8fbfc;
    text-align:center;
    cursor:pointer;
    transition:.2s;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:120px;
}

.file-upload:hover{
    border-color:var(--accent);
    background:#eefcff;
}

.file-upload input{
    display:none;
}

.file-upload-text{
    color:var(--text-secondary);
    font-size:.9rem;
}

.file-upload-text strong{
    color:var(--accent);
}

.btn-main{
    width:100%;
    border:none;
    padding:14px;
    margin-top:16px;
    border-radius:12px;
    background:var(--sidebar);
    color:white;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
    font-size:.95rem;
}

.btn-main:hover{
    opacity:.95;
}

.btn-secondary{
    display:inline-block;
    padding:10px 20px;
    border-radius:10px;
    font-weight:700;
    text-decoration:none;
    cursor:pointer;
    border:1.5px solid var(--border);
    background:white;
    color:var(--text);
    font-size:.9rem;
    transition:.2s;
}

.btn-secondary:hover{
    border-color:var(--accent);
}

.error-box{
    background:#fff5f5;
    color:#dc2626;
    border:1px solid #fecaca;
    border-radius:12px;
    padding:12px;
    margin-bottom:20px;
    text-align:center;
}

.footer{
    margin-top:24px;
    text-align:center;
    color:var(--text-secondary);
}

.footer a{
    color:var(--accent);
    text-decoration:none;
}

@media (max-width:600px){
    .title{
        font-size:1.5rem;
    }
}

</style>
</head>

<body>

<div class="container">

<div class="logo-wrap">
    <h1 class="brand">
        <a href="/">
            Up<span>ward</span>
        </a>
    </h1>
</div>

<div class="breadcrumb">
    <a href="/courses">Courses</a> /
    <a href="/lessons/{{ course.id }}">{{ course.title }}</a> /
    Add Lesson
</div>

<h2 class="title">Add a <span>Lesson</span></h2>
<p class="subtitle">
    Create a new lesson for <strong>{{ course.title }}</strong>.
    Enter a title, add content directly, or upload a PDF/TXT file.
</p>

{% if error %}
<div class="error-box">
    {{ error }}
</div>
{% endif %}

<form method="POST" action="/create_lesson/{{ course.id }}" enctype="multipart/form-data">

    <div class="form-group">
        <label class="form-label">Lesson Title</label>
        <input type="text" name="title" class="form-control" placeholder="e.g., Introduction to Variables" required>
    </div>

    <div class="form-group">
        <label class="form-label">Content (optional)</label>
        <textarea name="content" class="form-control" placeholder="Write lesson content here, or upload a file below..."></textarea>
    </div>

    <div class="form-group">
        <label class="form-label">Upload Lesson File (PDF or TXT)</label>
        <label class="file-upload" id="fileDropZone">
            <input type="file" name="lesson_pdf" accept=".pdf,.txt" id="lessonInput">
            <div class="file-upload-text" id="fileUploadText">
                <strong>Click to upload</strong> or drag and drop
            </div>
        </label>
    </div>

    <button type="submit" class="btn-main">Create Lesson</button>

</form>

<div class="footer">
    <a href="/lessons/{{ course.id }}">← Back to {{ course.title }}</a>
</div>

</div>

<script>
const fileInput = document.getElementById('lessonInput');
const fileDropZone = document.getElementById('fileDropZone');
const fileUploadText = document.getElementById('fileUploadText');

fileInput.addEventListener('change', function(e) {
    if (e.target.files.length > 0) {
        fileUploadText.innerHTML = '<strong>' + e.target.files[0].name + '</strong>';
        fileDropZone.style.borderColor = 'var(--accent)';
        fileDropZone.style.background = '#eefcff';
    }
});

// Drag and drop support
fileDropZone.addEventListener('dragover', function(e) {
    e.preventDefault();
    fileDropZone.style.borderColor = 'var(--accent)';
    fileDropZone.style.background = '#eefcff';
});

fileDropZone.addEventListener('dragleave', function(e) {
    e.preventDefault();
    fileDropZone.style.borderColor = 'var(--border)';
    fileDropZone.style.background = '#f8fbfc';
});

fileDropZone.addEventListener('drop', function(e) {
    e.preventDefault();
    fileDropZone.style.borderColor = 'var(--accent)';
    fileDropZone.style.background = '#eefcff';
    if (e.dataTransfer.files.length > 0) {
        fileInput.files = e.dataTransfer.files;
        fileUploadText.innerHTML = '<strong>' + e.dataTransfer.files[0].name + '</strong>';
    }
});
</script>

</body>
</html>
