<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ lesson.title }} - Lesson</title>



<link rel="stylesheet" href="/static/micro.css">
    <link rel="stylesheet" href="/static/lesson_display.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js" crossorigin="anonymous" defer></script>
    <script src="/static/animations.js" defer></script>
<link rel="stylesheet" href="/static/brand.css">
<link rel="stylesheet" href="/static/reactbits.css">
</head>

<body>

{% include '_navbar.html' %}

<main class="container">

    <section class="hero">
        <div class="breadcrumb">
            <a href="/courses">Courses</a> / <a href="/lessons/{{ course.id }}">{{ course.title }}</a> / {{ lesson.title }}
        </div>
        <a href="/lessons/{{ course.id }}" class="btn-secondary">← Back to Lessons</a>
    </section>

    <section class="section">
        <div class="lesson-content">
            <h1 class="lesson-title">{{ lesson.title }}</h1>
            <div class="card">
                <div class="section-title">Lesson Content</div>
                {% if lesson.content %}
                <div class="lesson-body">{{ lesson.content|safe }}</div>
                {% else %}
                <p style="color:var(--text-secondary);">No content available for this lesson.</p>
                {% endif %}
            </div>
        </div>
    </section>

    <div class="font-control">
        <label for="fontSize">Font Size</label>
        <input type="range" id="fontSize" min="12" max="24" step="1" value="17">
        <span class="size-label" id="sizeLabel">17px</span>
    </div>

</main>

<script>
    // Anti-copy protections
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'C' || e.key === 'J')) || (e.ctrlKey && (e.key === 'U' || e.key === 'S' || e.key === 'P'))) {
            e.preventDefault();
        }
    });

    // Font size slider - persist preference across visits
    const slider = document.getElementById('fontSize');
    const label = document.getElementById('sizeLabel');
    const targets = document.querySelectorAll('.lesson-body');

    function setSize(val) {
        label.textContent = val + 'px';
        targets.forEach(el => el.style.fontSize = val + 'px');
        localStorage.setItem('lessonFontSize', val); // Save preference
    }

    // Restore saved font size or use slider default
    const saved = localStorage.getItem('lessonFontSize');
    if (saved) {
        slider.value = saved;
        setSize(saved);
    } else {
        setSize(slider.value);
    }

    // Update on slider drag
    slider.addEventListener('input', () => setSize(slider.value));
</script>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js" defer></script>
<script src="/static/brand.js" defer></script>
<script src="/static/reactbits.js" defer></script>
</body>
</html>
