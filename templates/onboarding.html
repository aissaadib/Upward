<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onboarding - Upward</title>

<style>
:root{
    --accent:#3ec3d5;
    --bg:#f7f7fa;
    --text:#1e2240;
    --text-secondary:#6b7280;
    --border:#e1e0e6;
    --sidebar:#23273c;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
    min-height:100vh;
    background:var(--bg);
    font-family:Inter,Segoe UI,sans-serif;
    color:var(--text);
}

.page{padding:32px 20px 80px;}
.wrap{width:min(920px,90%);margin:auto;}

.top-row{
    display:flex;
    justify-content:space-between;
    padding-bottom:24px;
    border-bottom:1px solid var(--border);
    margin-bottom:40px;
}

.back-link{
    text-decoration:none;
    color:var(--text-secondary);
}
.back-link:hover{color:var(--accent);}

.step-pill{
    background:#eef8fa;
    color:var(--accent);
    padding:8px 14px;
    border-radius:999px;
    font-weight:700;
    font-size:.8rem;
}

.progress-track{
    height:6px;
    background:#e9edf1;
    border-radius:999px;
    overflow:hidden;
    margin-bottom:40px;
}

.progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:.25s;
}

.screen{display:none;}
.screen.active{display:block;}

.title{
    font-size:clamp(2.3rem,5vw,3.5rem);
    font-weight:900;
    line-height:1.05;
    margin-bottom:10px;
}

.sub{
    color:var(--text-secondary);
    margin-bottom:30px;
    max-width:700px;
    line-height:1.7;
}

/* OPTIONS */
.options-list{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:12px;
}

.option-btn{
    padding:14px;
    border:1px solid var(--border);
    border-radius:12px;
    background:white;
    cursor:pointer;
    text-align:left;
}

.option-btn.selected{
    border-color:var(--accent);
    background:#eef8fa;
}

/* INPUT */
.text-input{
    width:100%;
    padding:14px;
    border:1px solid var(--border);
    border-radius:12px;
    background:white;
    margin-top:10px;
}

.text-input:focus{
    outline:none;
    border-color:var(--accent);
}

/* NAV */
.nav-row{
    display:flex;
    gap:12px;
    margin-top:30px;
}

.btn-next{
    flex:1;
    padding:14px;
    border:none;
    border-radius:12px;
    background:var(--sidebar);
    color:white;
    opacity:.4;
    pointer-events:none;
    font-weight:700;
}

.btn-next.active{
    opacity:1;
    pointer-events:auto;
}

.btn-back{
    width:60px;
    border:1px solid var(--border);
    background:white;
    border-radius:12px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="page">
<div class="wrap">

    <div class="top-row">
        <a href="/" class="back-link">← Back</a>
        <div class="step-pill" id="step-pill">Profile setup</div>
    </div>

    <div class="progress-track">
        <div class="progress-fill" id="progress"></div>
    </div>

    <form id="form" action="/onboarding" method="POST">
        <input type="hidden" name="answers" id="answers-input">
    </form>

    <div id="screen"></div>

</div>
</div>

<script>

/* =========================
   REAL COUNTRY VALIDATION
========================= */

const validCountries = [
    "morocco","france","usa","united states","uk","germany","spain",
    "italy","canada","brazil","india","japan","china","australia",
    "uae","saudi arabia","egypt","turkey","portugal","netherlands"
];

function isCountryValid(c){
    return validCountries.includes((c||"").toLowerCase().trim());
}

/* =========================
   QUESTIONS SYSTEM
========================= */

const questions = [
    {
        type:"options",
        q:"What is your main field?",
        options:[
            "Technology and Coding",
            "Business and Finance",
            "Art and Design",
            "Science",
            "Education",
            "Media",
            "Engineering"
        ]
    },

    {
        type:"options",
        q:"What is your current level?",
        options:[
            "Beginner",
            "Intermediate",
            "Advanced",
            "Professional"
        ]
    },

    {
        type:"multi",
        q:"Which tools do you know?",
        options:[
            "Python","JavaScript","HTML/CSS","Excel","SQL",
            "Figma","Git","Photoshop","Canva","Notion"
        ]
    },

    {
        type:"text",
        q:"Which tool are you BEST at?",
        placeholder:"e.g. Python, Figma, Excel..."
    },

    {
        type:"options",
        q:"How much time per week?",
        options:["<2h","2-5h","5-10h","10-20h","20h+"]
    },

    {
        type:"text",
        q:"Which country are you in?",
        placeholder:"e.g. Morocco, France, USA..."
    },

    {
        type:"text",
        q:"Which city or region?",
        placeholder:"Optional..."
    }
];

let i = 0;
let answers = {};

function render(){

    const q = questions[i];

    document.getElementById("step-pill").textContent =
        `Question ${i+1} / ${questions.length}`;

    let html = `<h1 class="title">${q.q}</h1>`;

    if(q.type==="options" || q.type==="multi"){
        html += `<div class="options-list">` +
        q.options.map(opt=>`
            <button type="button"
                class="option-btn"
                onclick="selectOption('${opt}')">
                ${opt}
            </button>
        `).join("") +
        `</div>`;
    }
    else{
        html += `
            <input class="text-input"
                id="text"
                placeholder="${q.placeholder}"
                oninput="updateText(this.value)">
        `;
    }

    html += `
    <div class="nav-row">
        <button class="btn-back" type="button" onclick="back()">←</button>
        <button class="btn-next" id="next" type="button" onclick="next()">Continue</button>
    </div>`;

    document.getElementById("screen").innerHTML = html;

    updateProgress();
    updateButton();
}

function selectOption(val){
    answers[`q${i}`] = val;
    document.querySelectorAll(".option-btn").forEach(b=>{
        b.classList.remove("selected");
        if(b.textContent.trim()===val) b.classList.add("selected");
    });
    updateButton();
}

function updateText(val){
    answers[`q${i}`] = val;
    updateButton();
}

function updateButton(){
    const q = questions[i];
    const val = answers[`q${i}`];

    const valid = q.type==="options"
        ? !!val
        : !!val;

    const btn = document.getElementById("next");
    if(btn){
        btn.classList.toggle("active", valid);
    }
}

function updateProgress(){
    document.getElementById("progress").style.width =
        `${((i)/questions.length)*100}%`;
}

function next(){

    const q = questions[i];
    const val = answers[`q${i}`];

    if(!val && !q.optional) return;

    i++;

    if(i >= questions.length){
        finish();
        return;
    }

    render();
}

function back(){
    if(i>0){
        i--;
        render();
    }
}

function finish(){

    const country = answers["q5"];

    if(!isCountryValid(country)){
        alert("Please enter a valid country.");
        i = 5;
        render();
        return;
    }

    document.getElementById("answers-input").value =
        JSON.stringify(answers);

    document.getElementById("form").submit();
}

render();

</script>

</body>
</html>
