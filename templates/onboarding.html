<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding - Upward</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c8f5ee;
            padding: 24px;
            position: relative;
            overflow: hidden;
            background: #061e20;
        }

        canvas#water {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        .container-wrap {
            width: 100%;
            max-width: 580px;
            position: relative;
            z-index: 10;
        }

        h2 { font-size: 1.4rem; font-weight: 800; color: #c8f5ee; margin-bottom: 8px; }
        h2 span { color: #2ec4a0; }
        .subtitle { color: #4a8f8a; font-size: 0.9rem; margin-bottom: 28px; }

        .choice-card {
            background: rgba(10, 40, 44, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(46, 196, 160, 0.25);
            border-radius: 18px;
            padding: 22px 26px;
            margin-bottom: 14px;
        }

        .input-wrap { display: flex; flex-direction: column; }

        .linkedin-input {
            width: 100%;
            background: rgba(6, 30, 32, 0.7);
            border: 1.5px solid #1a5c5a;
            border-radius: 12px;
            padding: 13px 16px;
            color: #c8f5ee;
            font-size: 0.92rem;
            font-weight: 500;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .linkedin-input::placeholder { color: #3a7070; }
        .linkedin-input:focus {
            border-color: #2ec4a0;
            box-shadow: 0 0 0 3px rgba(46,196,160,0.15);
        }

        .choice-desc { font-size: 0.78rem; color: #3a7070; margin-top: 10px; }

        .btn-continue {
            width: 100%;
            background: #2ec4a0;
            border: none;
            color: #061e20;
            font-weight: 800;
            border-radius: 12px;
            padding: 14px;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s, transform 0.1s;
            letter-spacing: 0.02em;
        }
        .btn-continue:hover { background: #25a98a; transform: translateY(-1px); }
        .btn-continue:active { transform: translateY(0); }

        .back {
            display: inline-block;
            color: #3a7070;
            font-size: 0.85rem;
            text-decoration: none;
            margin-bottom: 28px;
            transition: color 0.2s;
        }
        .back:hover { color: #2ec4a0; }
    </style>
</head>
<body>
    <canvas id="water"></canvas>

    <div class="container-wrap">
        <a href="/" class="back">← Back</a>
        <h2>Link your <span>LinkedIn</span></h2>
        <p class="subtitle">We will personalize your experience based on your profile and capabilities.</p>
        <form action="/onboarding" method="POST">
            <div class="choice-card">
                <div class="input-wrap">
                    <input type="url" name="profile" class="linkedin-input" placeholder="Paste your LinkedIn profile link" required>
                    {% if error %}
                        <p style="color:#ff6b8a;font-size:0.82rem;margin-top:8px;">Please provide a valid LinkedIn link.</p>
                    {% endif %}
                    <div class="choice-desc">This allows us to understand your background and capabilities.</div>
                </div>
            </div>
            <button type="submit" class="btn-continue">Continue</button>
        </form>
    </div>

    <script>
        const canvas = document.getElementById('water');
        const ctx = canvas.getContext('2d');
        let W, H, t = 0;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        function hsl(h, s, l, a = 1) {
            return `hsla(${h},${s}%,${l}%,${a})`;
        }

        function drawWave(yBase, amp, freq, speed, phase, color) {
            ctx.beginPath();
            ctx.moveTo(0, H);
            for (let x = 0; x <= W; x += 2) {
                const y = yBase
                    + Math.sin(x * freq + t * speed + phase) * amp
                    + Math.sin(x * freq * 0.7 + t * speed * 1.3 + phase + 1) * amp * 0.5
                    + Math.sin(x * freq * 1.4 + t * speed * 0.8 + phase + 2) * amp * 0.3;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(W, H);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
        }

        function draw() {
            t += 0.008;

            ctx.fillStyle = '#061e20';
            ctx.fillRect(0, 0, W, H);

            const mid = H * 0.52;

            drawWave(mid + 80,  30, 0.008, 0.6, 0,   hsl(168, 60, 14, 0.9));
            drawWave(mid + 50,  40, 0.006, 0.5, 1.2, hsl(172, 65, 18, 0.85));
            drawWave(mid + 20,  50, 0.005, 0.4, 2.5, hsl(175, 70, 22, 0.8));
            drawWave(mid,       60, 0.004, 0.35, 0.8, hsl(178, 72, 26, 0.75));
            drawWave(mid - 30,  55, 0.005, 0.45, 3.1, hsl(180, 68, 20, 0.7));
            drawWave(mid - 60,  45, 0.006, 0.55, 1.8, hsl(182, 64, 16, 0.65));
            drawWave(mid - 90,  35, 0.007, 0.65, 4.2, hsl(170, 58, 12, 0.55));

            const shimmer = ctx.createLinearGradient(0, mid - 100, 0, mid + 100);
            shimmer.addColorStop(0, 'rgba(46,196,160,0.0)');
            shimmer.addColorStop(0.4 + Math.sin(t * 0.5) * 0.1, 'rgba(46,196,160,0.06)');
            shimmer.addColorStop(1, 'rgba(46,196,160,0.0)');
            ctx.fillStyle = shimmer;
            ctx.fillRect(0, mid - 100, W, 200);

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
