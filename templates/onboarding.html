<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding - Upward</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c8f5ee;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        .bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            background: linear-gradient(135deg, #0d2b2e, #0a3d35, #112f32, #061e20, #0d3b2e);
            background-size: 400% 400%;
            animation: gradientShift 10s ease infinite;
        }

        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            25%  { background-position: 100% 0%; }
            50%  { background-position: 100% 100%; }
            75%  { background-position: 0% 100%; }
            100% { background-position: 0% 50%; }
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: orbFloat linear infinite;
            z-index: 0;
        }

        @keyframes orbFloat {
            0%   { transform: translate(0, 0) scale(1); }
            33%  { transform: translate(40px, -60px) scale(1.1); }
            66%  { transform: translate(-30px, 40px) scale(0.9); }
            100% { transform: translate(0, 0) scale(1); }
        }

        .container-wrap {
            width: 100%;
            max-width: 620px;
            position: relative;
            z-index: 10;
        }

        h2 { font-size: 1.4rem; font-weight: 800; color: #c8f5ee; margin-bottom: 8px; }
        h2 span { color: #2ec4a0; }
        .subtitle { color: #4a8f8a; font-size: 0.9rem; margin-bottom: 28px; }

        .choice-card {
            background: rgba(17, 47, 50, 0.85);
            backdrop-filter: blur(12px);
            border: 1.5px solid #1a5c5a;
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 14px;
            transition: border-color 0.3s;
        }
        .choice-card:focus-within { border-color: #2ec4a0; }

        .input-wrap { flex: 1; display: flex; flex-direction: column; }

        .linkedin-input {
            width: 100%;
            background: rgba(13, 43, 46, 0.8);
            border: 1.5px solid #1a5c5a;
            border-radius: 12px;
            padding: 12px 14px;
            color: #c8f5ee;
            font-size: 0.9rem;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .linkedin-input::placeholder { color: #4a8f8a; font-weight: 500; }
        .linkedin-input:focus {
            border-color: #2ec4a0;
            box-shadow: 0 0 0 0.2rem rgba(46,196,160,0.2);
        }

        .choice-desc { font-size: 0.8rem; color: #4a8f8a; margin-top: 8px; }

        .btn-continue {
            width: 100%;
            background: #2ec4a0;
            border: none;
            color: #0d2b2e;
            font-weight: 700;
            border-radius: 12px;
            padding: 14px;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-continue:hover { background: #25a98a; transform: translateY(-1px); }
        .btn-continue:active { transform: translateY(0); }

        .back {
            display: inline-block;
            color: #4a8f8a;
            font-size: 0.85rem;
            text-decoration: none;
            margin-bottom: 24px;
            transition: color 0.2s;
        }
        .back:hover { color: #2ec4a0; }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="orb" style="width:400px;height:400px;background:#2ec4a0;top:-100px;left:-100px;animation-duration:18s;"></div>
    <div class="orb" style="width:300px;height:300px;background:#0a6b5a;bottom:-80px;right:-80px;animation-duration:14s;animation-delay:-5s;"></div>
    <div class="orb" style="width:250px;height:250px;background:#1a8c78;top:40%;left:60%;animation-duration:20s;animation-delay:-9s;"></div>

    <div class="container-wrap">
        <a href="/" class="back">← Back</a>
        <h2>Link your <span>LinkedIn</span></h2>
        <p class="subtitle">We will personalize your experience based on your profile and capabilities.</p>
        <form action="/onboarding" method="POST">
            <div class="choice-card">
                <div class="input-wrap">
                    <input type="url" name="profile" class="linkedin-input" placeholder="Paste your LinkedIn profile link" required>
                    {% if error %}
                        <p style="color:#ff6b8a;" class="small mt-2">Please provide a LinkedIn link to your profile!</p>
                    {% endif %}
                    <div class="choice-desc">This will allow us to understand your capabilities.</div>
                </div>
            </div>
            <button type="submit" class="btn-continue">Continue</button>
        </form>
    </div>
</body>
</html>
