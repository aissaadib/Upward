// Map education status answers to simplified tier keys for branching logic
const EDUCATION_TIERS = {
    "Still in high school":"school",
    "Undergraduate student":"undergrad",
    "Graduate student":"grad",
    "Recently graduated":"grad",
    "Working professional":"professional",
    "Self-taught / no formal education":"self_taught"
};

let i = 0; // Current question index
let answers = {}; // Accumulated user answers

// Resolve the user's education tier from their answer to q1
function getTier(){
    return EDUCATION_TIERS[answers.q1] || null;
}

// Get the active question list, applying tier-based filtering, variants, and conditional logic
function getActiveQuestions(){
    const tier = getTier();
    return allQuestions
        .filter(q => {
            if(q.skipWhen && tier && q.skipWhen.includes(tier)) return false;
            if(q.showWhen){
                const prevAnswer = answers[q.showWhen.key];
                if(q.showWhen.not && prevAnswer === q.showWhen.not) return false;
                if(q.showWhen.eq && prevAnswer !== q.showWhen.eq) return false;
            }
            return true;
        })
        .map(q => {
            const copy = {...q, options: q.options ? [...q.options] : undefined};
            if(tier === "school" && q.schoolVariant){
                Object.assign(copy, q.schoolVariant);
                if(q.schoolVariant.options) copy.options = [...q.schoolVariant.options];
            }
            if(q.optionFilter && tier && q.optionFilter[tier]){
                copy.options = copy.options.filter(o => !q.optionFilter[tier].includes(o));
            }
            if(q.subByTier && tier && q.subByTier[tier]) copy.sub = q.subByTier[tier];
            return copy;
        });
}

// Remove stale answers when education tier changes and re-validate existing ones
function pruneAnswers(){
    const active = getActiveQuestions();
    const activeKeys = new Set(active.map(q => q.key));
    Object.keys(answers).forEach(k => { if(!activeKeys.has(k)) delete answers[k]; });
    active.forEach(q => {
        const val = answers[q.key];
        if(!val) return;
        if(q.type === "options" && !q.options.includes(val)) delete answers[q.key];
        if(q.type === "multi" && Array.isArray(val)){
            answers[q.key] = val.filter(v => q.options.includes(v));
            if(answers[q.key].length === 0) delete answers[q.key];
        }
        if(q.type === "dynamic_multi" && Array.isArray(val)){
            // Keep AI-generated tool selections; NONE resets the array
            if(val.includes(NONE_OPTION)) answers[q.key] = [NONE_OPTION];
        }
    });
}

// Cache for AI-generated tool options keyed by field name
let cachedToolOptions = {};

// Fetch tool/skill suggestions from AI for the selected field
async function loadToolOptions(field){
    if(cachedToolOptions[field]) return cachedToolOptions[field];
    const resp = await fetch("/api/generate_tools", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({field})
    });
    const data = await resp.json();
    if(data.tools && data.tools.length){
        cachedToolOptions[field] = data.tools;
        return data.tools;
    }
    return [];
}

// Cache for AI-generated skill suggestions keyed by field name
let cachedSkillSuggestions = {};

// Fetch skill suggestions from AI for the selected field (≤5)
async function loadSkillSuggestions(field){
    if(cachedSkillSuggestions[field]) return cachedSkillSuggestions[field];
    const resp = await fetch("/api/generate_skills", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({field})
    });
    const data = await resp.json();
    if(data.skills && data.skills.length){
        cachedSkillSuggestions[field] = data.skills;
        return data.skills;
    }
    return [];
}

// Render the current question screen based on question type
function render(){
    const qs = getActiveQuestions();
    if(i >= qs.length) i = Math.max(0, qs.length - 1);
    const q = qs[i];
    document.getElementById("step-pill").textContent = `Question ${i+1} / ${qs.length}`;
    // Animate progress bar smoothly instead of instant width jump
    const progressEl = document.getElementById("progress");
    const pct = (i / qs.length) * 100;
    if(typeof animateProgress === "function") animateProgress(progressEl, pct, 300);
    else progressEl.style.width = pct + "%";

    let html = `<h1 class="title">${q.q}</h1><p class="sub">${q.sub}</p>`;

    if(q.type === "options"){
        // Single-select option buttons
        html += `<div class="options-list">`;
        q.options.forEach(opt => {
            const sel = answers[q.key] === opt ? " selected" : "";
            html += `<button type="button" class="option-btn${sel}" onclick="selectOption('${opt.replace(/'/g,"\\'")}', this)">${opt}</button>`;
        });
        html += `</div>`;
        if(q.other){
            // Custom "Other" text input alongside preset options
            html += `<div style="margin-top:12px;display:flex;gap:10px;">
                <input class="text-input" id="other-input" placeholder="Or type your own..." style="margin-top:0;" value="${(answers[q.key] && !q.options.includes(answers[q.key])) ? answers[q.key] : ''}">
                <button type="button" onclick="useOther()" style="padding:12px 18px;border:1.5px solid var(--border);border-radius:12px;background:white;cursor:pointer;font-weight:700;white-space:nowrap;color:var(--text);">Use this</button>
            </div>`;
        }
    } else if(q.type === "multi"){
        // Multi-select option buttons with None toggle logic
        const selected = answers[q.key] || [];
        html += `<p class="multi-hint">Select all that apply — or pick None</p><div class="options-list">`;
        q.options.forEach(opt => {
            const sel = selected.includes(opt) ? " selected" : "";
            html += `<button type="button" class="option-btn${sel}" onclick="toggleMulti('${opt.replace(/'/g,"\\'")}', this)">${opt}</button>`;
        });
        html += `</div>`;
    } else if(q.type === "dynamic_multi"){
        // AI-generated multi-select options
        const selected = answers[q.key] || [];
        const field = answers.field || "";
        html += `<p class="multi-hint">Select all that apply — or pick None</p><div class="options-list" id="dynamic-options">`;
        html += `<div style="text-align:center;padding:20px;color:var(--muted)">Loading options...</div>`;
        html += `</div>`;
        // Trigger async fetch and re-render the options list
        (async () => {
            const tools = await loadToolOptions(field);
            const container = document.getElementById("dynamic-options");
            if(!container) return;
            const unique = [...new Set([...tools, NONE_OPTION])];
            container.innerHTML = unique.map(opt => {
                const sel = selected.includes(opt) ? " selected" : "";
                return `<button type="button" class="option-btn${sel}" onclick="toggleDynamic('${opt.replace(/'/g,"\\'")}', this)">${opt}</button>`;
            }).join("");
        })();
    } else if(q.type === "country"){
        // Modern searchable country input with flags
        const val = answers[q.key] || "";
        const flag = COUNTRY_FLAGS[val] || "";
        html += `<div class="country-combo" id="country-wrapper">
            <div class="country-input-wrap">
                <input class="country-input" id="country-input" type="text"
                    placeholder="Search your country..."
                    value="${val ? flag + '  ' + val : ''}"
                    autocomplete="off"
                    oninput="filterCountries(this.value)"
                    onfocus="openCountryList()"
                    onkeydown="countryKeydown(event)">
                <button type="button" class="country-clear" id="country-clear" onclick="selectCountry('')"${val ? '' : ' style="display:none"'}>×</button>
            </div>
            <div class="country-list" id="country-list">
                ${COUNTRIES.map(c => {
                    const f = COUNTRY_FLAGS[c] || "";
                    const sel = c === val ? ' selected' : '';
                    return `<div class="country-opt${sel}" data-value="${c.replace(/'/g,"\\'")}" onclick="selectCountry('${c.replace(/'/g,"\\'")}')">${f} <span>${c}</span></div>`;
                }).join("")}
            </div>
        </div>`;
    } else if(q.type === "dynamic_suggest"){
        // AI-suggested skill options + text input
        const val = answers[q.key] || "";
        const field = answers.field || "";
        html += `<div class="options-list" id="skills-options">`;
        html += `<div style="text-align:center;padding:20px;color:var(--muted)">Loading suggestions...</div>`;
        html += `</div>`;
        html += `<div style="margin-top:12px;display:flex;gap:10px;">
            <input class="text-input" id="other-input" placeholder="${q.placeholder}" style="margin-top:0;" value="${val}">
            <button type="button" onclick="useSkillOther()" style="padding:12px 18px;border:1.5px solid var(--border);border-radius:12px;background:white;cursor:pointer;font-weight:700;white-space:nowrap;color:var(--text);">Use this</button>
        </div>`;
        // Trigger async fetch and render suggestions
        (async () => {
            const skills = await loadSkillSuggestions(field);
            const container = document.getElementById("skills-options");
            if(!container) return;
            if(!skills.length){ container.innerHTML = ""; return; }
            container.innerHTML = skills.map(s => {
                const sel = val === s ? " selected" : "";
                return `<button type="button" class="option-btn${sel}" onclick="selectSkillSuggestion('${s.replace(/'/g,"\\'")}', this)">${s}</button>`;
            }).join("");
        })();
    } else {
        // Text input fields
        const val = answers[q.key] || "";
        html += `<input class="text-input" id="text-input" placeholder="${q.placeholder}" value="${val}" oninput="updateText(this.value)">`;
        if(q.optional) html += `<p class="skip-hint">You can skip this one.</p>`;
    }

    // Navigation buttons - back and next/submit
    html += `<div class="nav-row">
        <button class="btn-back" type="button" onclick="back()">←</button>
        <button class="btn-next${isValid(q) ? ' active' : ''}" id="btn-next" type="button" onclick="next()">${i === getActiveQuestions().length-1 ? 'Build my profile' : 'Continue'}</button>
    </div>`;

    document.getElementById("screen").innerHTML = html;
}

// Validate whether the current question has a sufficient answer
function isValid(q){
    const val = answers[q.key];
    if(q.optional) return true;
    if(q.type === "multi" || q.type === "dynamic_multi") return val && val.length > 0;
    return !!val;
}

// Handle single-option selection
function selectOption(val, btn){
    const key = getActiveQuestions()[i].key;
    answers[key] = val;
    if(key === "q1") pruneAnswers(); // Re-evaluate questions when education tier changes
    document.querySelectorAll(".option-btn").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    const nb = document.getElementById("btn-next");
    if(nb) nb.classList.add("active");
}

// Handle multi-select toggle with special None option handling
function toggleMulti(val, btn){
    const key = getActiveQuestions()[i].key;
    if(!answers[key]) answers[key] = [];
    const arr = answers[key];

    if(val === NONE_OPTION){
        // Toggle "None" - selecting None clears all other selections and vice versa
        if(arr.includes(NONE_OPTION)){
            arr.splice(arr.indexOf(NONE_OPTION), 1);
            btn.classList.remove("selected");
        } else {
            answers[key] = [NONE_OPTION];
            document.querySelectorAll(".option-btn").forEach(b => b.classList.remove("selected"));
            btn.classList.add("selected");
        }
    } else {
        // Remove None if user picks a real option, then toggle the selected value
        const noneIdx = arr.indexOf(NONE_OPTION);
        if(noneIdx > -1){
            arr.splice(noneIdx, 1);
            document.querySelectorAll(".option-btn").forEach(b => {
                if(b.textContent === NONE_OPTION) b.classList.remove("selected");
            });
        }
        const idx = arr.indexOf(val);
        if(idx > -1){ arr.splice(idx,1); btn.classList.remove("selected"); }
        else { arr.push(val); btn.classList.add("selected"); }
    }

    const nb = document.getElementById("btn-next");
    if(nb) nb.classList.toggle("active", arr.length > 0);
}

// Handle multi-select toggle for AI-generated dynamic options (same logic as toggleMulti)
function toggleDynamic(val, btn){
    toggleMulti(val, btn);
}

// Store text input value and toggle Next button state
function updateText(val){
    answers[getActiveQuestions()[i].key] = val;
    const nb = document.getElementById("btn-next");
    if(nb) nb.classList.toggle("active", !!val || !!getActiveQuestions()[i].optional);
}

// Apply a custom typed-in answer for questions with the "other" option
function useOther(){
    const val = document.getElementById("other-input")?.value.trim();
    if(!val) return;
    answers[getActiveQuestions()[i].key] = val;
    document.querySelectorAll(".option-btn").forEach(b => b.classList.remove("selected"));
    document.getElementById("other-input").style.borderColor = "var(--accent)";
    const nb = document.getElementById("btn-next");
    if(nb) nb.classList.add("active");
}

// Select an AI-suggested skill (single-select) for dynamic_suggest questions
function selectSkillSuggestion(val, btn){
    const key = getActiveQuestions()[i].key;
    answers[key] = val;
    document.querySelectorAll(".option-btn").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    document.getElementById("other-input").value = val;
    document.getElementById("other-input").style.borderColor = "var(--accent)";
    const nb = document.getElementById("btn-next");
    if(nb) nb.classList.add("active");
}

// Use custom typed-in skill for dynamic_suggest questions
function useSkillOther(){
    const val = document.getElementById("other-input")?.value.trim();
    if(!val) return;
    const key = getActiveQuestions()[i].key;
    answers[key] = val;
    document.querySelectorAll(".option-btn").forEach(b => b.classList.remove("selected"));
    document.getElementById("other-input").style.borderColor = "var(--accent)";
    const nb = document.getElementById("btn-next");
    if(nb) nb.classList.add("active");
}

// Modern searchable country input
var countryFocusIdx = -1;

function openCountryList(){
    var list = document.getElementById("country-list");
    if(list) list.classList.add("open");
}

function closeCountryList(){
    var list = document.getElementById("country-list");
    if(list) list.classList.remove("open");
    countryFocusIdx = -1;
}

function filterCountries(query){
    var list = document.getElementById("country-list");
    if(!list) return;
    var q = query.replace(/[^a-zA-Z\s]/g, "").toLowerCase().trim();
    var opts = list.querySelectorAll(".country-opt");
    var visible = 0;
    opts.forEach(function(o){
        var label = o.querySelector("span").textContent.toLowerCase();
        var match = !q || label.indexOf(q) !== -1;
        o.style.display = match ? "" : "none";
        if(match) visible++;
    });
    list.classList.add("open");
    countryFocusIdx = -1;
    updateCountryHighlight();
}

function updateCountryHighlight(){
    var list = document.getElementById("country-list");
    if(!list) return;
    var opts = list.querySelectorAll(".country-opt:not([style*='display: none'])");
    opts.forEach(function(o, idx){
        o.classList.toggle("highlight", idx === countryFocusIdx);
    });
}

function countryKeydown(e){
    var list = document.getElementById("country-list");
    var opts = list ? list.querySelectorAll(".country-opt:not([style*='display: none'])") : [];
    if(e.key === "ArrowDown"){
        e.preventDefault();
        countryFocusIdx = Math.min(countryFocusIdx + 1, opts.length - 1);
        updateCountryHighlight();
        if(opts[countryFocusIdx]) opts[countryFocusIdx].scrollIntoView({block:"nearest"});
    } else if(e.key === "ArrowUp"){
        e.preventDefault();
        countryFocusIdx = Math.max(countryFocusIdx - 1, 0);
        updateCountryHighlight();
        if(opts[countryFocusIdx]) opts[countryFocusIdx].scrollIntoView({block:"nearest"});
    } else if(e.key === "Enter"){
        e.preventDefault();
        if(opts[countryFocusIdx]) opts[countryFocusIdx].click();
    } else if(e.key === "Escape"){
        closeCountryList();
        document.getElementById("country-input")?.blur();
    }
}

function selectCountry(val){
    closeCountryList();
    var input = document.getElementById("country-input");
    var clear = document.getElementById("country-clear");
    if(val){
        var flag = COUNTRY_FLAGS[val] || "";
        input.value = flag + "  " + val;
        clear.style.display = "";
    } else {
        input.value = "";
        clear.style.display = "none";
    }
    updateText(val);
    // Mark selected in list
    var list = document.getElementById("country-list");
    if(list){
        list.querySelectorAll(".country-opt").forEach(function(o){
            o.classList.toggle("selected", o.dataset.value === val);
        });
    }
}

// Close on outside click
document.addEventListener("click", function(e){
    if(!e.target.closest("#country-wrapper")) closeCountryList();
});

// Advance to the next question or finish if on the last one
function next(){
    const qs = getActiveQuestions();
    const q = qs[i];
    if(!isValid(q)) return;
    const screen = document.getElementById("screen");
    if(typeof transitionOut === "function"){
        transitionOut(screen, function(){
            i++;
            if(i >= qs.length){ finish(); return; }
            render();
            if(typeof transitionIn === "function") transitionIn(screen);
        });
    } else {
        i++;
        if(i >= qs.length){ finish(); return; }
        render();
    }
}

// Go back to the previous question
function back(){
    if(i <= 0) return;
    const screen = document.getElementById("screen");
    if(typeof transitionOut === "function"){
        transitionOut(screen, function(){
            i--;
            render();
            if(typeof transitionIn === "function") transitionIn(screen);
        });
    } else {
        i--;
        render();
    }
}

// Submit all answers as JSON and trigger form submission
function finish(){
    document.getElementById("progress").style.width = "100%";
    document.getElementById("answers-input").value = JSON.stringify(answers);
    document.getElementById("form").submit();
}

// Initialize: render the first question
render();
</script>
